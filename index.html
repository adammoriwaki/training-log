<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1420">
<title>Tokyo27 — Adam's Training Log</title>
<style>
:root{
  --bg:#0f1420; --card:#1a2232; --card2:#212c42; --line:#2c3a55;
  --txt:#e8edf7; --dim:#8b98b3; --accent:#4f8ef7; --green:#3ecf8e;
  --orange:#f5a623; --red:#ef6461;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:84px}
header{padding:18px 16px 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:5}
h1{font-size:18px;font-weight:800;letter-spacing:.3px}
.sub{color:var(--dim);font-size:12px;margin-top:3px}
.countdown{color:var(--orange);font-weight:700}
.phase-band{margin:10px 16px 0;padding:9px 12px;border-radius:10px;font-size:12.5px;line-height:1.45;background:var(--card2);border:1px solid var(--line);color:var(--dim)}
.phase-band b{color:var(--txt)}
main{padding:8px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.session-label{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin:14px 4px 8px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-name{font-size:15.5px;font-weight:700}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--dim);margin-left:6px;vertical-align:middle}
.target{color:var(--dim);font-size:12.5px;margin-top:3px}
.desc{color:var(--dim);font-size:12px;margin-top:5px;font-style:italic;line-height:1.4}
.howto{display:inline-block;margin-top:7px;font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;background:var(--card2);border:1px solid var(--line);padding:5px 10px;border-radius:8px}
.cardio-in{flex:1;min-width:0;height:42px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:0 10px;font-size:13px;outline:none;margin-bottom:0}
.cardio-in::placeholder{color:#5b6880}
.sum-card{background:linear-gradient(160deg,#1b2436,#141b2b);border:1px solid #33436b;border-radius:18px;overflow:hidden;margin-top:8px}
.sum-head{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.sum-title{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--accent)}
.sum-date{font-size:13px;color:var(--dim);margin-top:3px}
.sum-session{font-size:16px;font-weight:800;margin-top:4px}
.sum-row{padding:9px 16px;border-bottom:1px solid #1e2941}
.sum-ex{font-size:13.5px;font-weight:700}
.sum-sets{font-size:13px;color:var(--dim);margin-top:1px;font-variant-numeric:tabular-nums}
.sum-note{font-size:11.5px;color:var(--orange);font-style:italic;margin-top:2px}
.sum-foot{display:flex;justify-content:space-between;padding:12px 16px;font-size:11px;color:var(--dim);border-top:1px solid var(--line)}
.last{margin-top:7px;font-size:12.5px;color:var(--green)}
.last.none{color:var(--dim)}
.coach{margin-top:5px;font-size:12.5px;font-weight:600;color:var(--orange,#f0a24a)}
.sets{margin-top:10px}
.setrow{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.setnum{width:20px;color:var(--dim);font-size:12px;font-weight:700}
.stepper{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:38px;height:40px;background:none;border:none;color:var(--accent);font-size:20px;font-weight:700}
.stepper input{width:52px;height:40px;background:none;border:none;color:var(--txt);font-size:15px;font-weight:700;text-align:center;outline:none}
.stepper .unit{color:var(--dim);font-size:10px;padding-right:8px}
.done-btn{margin-left:auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--dim);font-size:17px}
.done-btn.on{background:var(--green);border-color:var(--green);color:#08281a}
.addset{background:none;border:1px dashed var(--line);color:var(--dim);border-radius:10px;padding:8px;width:100%;font-size:12.5px;margin-top:2px}
.notes{width:100%;margin-top:9px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:9px;font-size:13px;font-family:inherit;resize:none}
.notes::placeholder{color:#5b6880}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0f1420;border-top:1px solid var(--line);z-index:10;transform:translateY(calc(-1 * var(--kb,0px)))}
body.kb-open nav{visibility:hidden}
nav button{flex:1;background:none;border:none;color:var(--dim);padding:11px 0 max(11px, env(safe-area-inset-bottom));font-size:10.5px;font-weight:600}
nav button .ic{display:block;font-size:19px;margin-bottom:2px}
nav button.on{color:var(--accent)}
.timer{position:fixed;bottom:76px;transform:translateY(calc(-1 * var(--kb,0px)));left:12px;right:12px;background:var(--accent);color:#fff;border-radius:14px;padding:12px 16px;display:none;align-items:center;justify-content:space-between;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.timer.show{display:flex}
.timer .t{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.timer button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;padding:7px 13px;font-weight:700;font-size:13px}
.daynav{display:flex;gap:5px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.daynav::-webkit-scrollbar{display:none}
.daybtn{flex:0 0 auto;min-width:46px;padding:7px 6px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:11px;text-align:center;font-weight:600}
.daybtn .dd{font-size:14px;color:var(--txt);font-weight:800;display:block}
.daybtn.on{border-color:var(--accent);background:#1b2b4d;color:var(--accent)}
.daybtn.on .dd{color:var(--accent)}
.wk-row{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);font-size:13px;gap:8px}
.wk-row:last-child{border:none}
.wk-row .l{color:var(--dim);flex-shrink:0}
.wk-row .r{text-align:right;line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--dim);font-weight:600;padding:7px 6px;border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
td{padding:8px 6px;border-bottom:1px solid #1e2941;vertical-align:top;line-height:1.4}
tr.cur td{background:#1b2b4d}
.ph-Build{color:var(--green)} .ph-Peak{color:var(--orange)} .ph-Taper{color:var(--accent)} .ph-RACE{color:var(--red);font-weight:700}
select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);padding:12px;border-radius:12px;font-size:15px;margin-bottom:10px}
.hist-sess{border-bottom:1px solid var(--line);padding:10px 2px}
.hist-sess:last-child{border:none}
.hist-date{font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
.hist-sets{font-size:14.5px;font-weight:700;margin-top:3px}
.hist-note{font-size:12px;color:var(--orange);margin-top:3px;font-style:italic}
.trend-up{color:var(--green)} .trend-flat{color:var(--dim)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:14px;font-weight:600;margin-bottom:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.warn{background:#3a2b18;border:1px solid #6b4a1c;color:var(--orange);border-radius:12px;padding:11px;font-size:12.5px;line-height:1.5;margin-bottom:10px}
.io{width:100%;height:120px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:11px;padding:8px;font-family:monospace;margin-bottom:8px}
.rest-hint{font-size:11px;color:var(--dim);margin-left:4px}
h2{font-size:15px;margin:6px 4px 10px}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:30px 10px;line-height:1.6}
</style>
</head>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="運動">
<meta name="theme-color" content="#0f1420">
<body>
<header>
  <h1>TOKYO27 TRAINING LOG</h1>
  <div class="sub" id="subhead"></div>
</header>
<div class="phase-band" id="phaseband"></div>
<main id="main"></main>

<div class="timer" id="timer">
  <div><div style="font-size:10px;font-weight:700;opacity:.8">REST</div><div class="t" id="timer-t">1:00</div></div>
  <div style="display:flex;gap:8px">
    <button onclick="Timer.add(30)">+30s</button>
    <button onclick="Timer.stop()">Done</button>
  </div>
</div>

<nav>
  <button id="nav-today" class="on" onclick="go('today')"><span class="ic">🏋️</span>Today</button>
  <button id="nav-fuel" onclick="go('fuel')"><span class="ic">🍽️</span>Fuel</button>
  <button id="nav-week" onclick="go('week')"><span class="ic">📅</span>Week</button>
  <button id="nav-history" onclick="go('history')"><span class="ic">📈</span>History</button>
  <button id="nav-plan" onclick="go('plan')"><span class="ic">🗺️</span>Plan</button>
  <button id="nav-data" onclick="go('data')"><span class="ic">💾</span>Data</button>
</nav>

<script>
const PLAN = {"race":"2027-03-07","week1":"2026-09-14","weeks":[{"wk":1,"phase":"Return","strength":"Back from 3-4 weeks off (Kuma). Loads DOWN ~15%, 2-3 sets not 4. WEEK SALVAGE: Mon Upper A and Tue run+Lower A happened; Wed-Fri got eaten. Weekend = Upper C Sat (the pull work that never happened) and Lower B Sun, so legs get a second session instead of sitting a full week and Monday's Upper A does not land on a third straight upper day. Upper B is the one dropped - it returns Friday of week 2. Runs easy: 5 Sat, 3 Sun. Two week-1 holds: pogos skipped, single-leg RDL bodyweight.","dl":true},{"wk":2,"phase":"Return","strength":"Full sets again (bench 4, everything else 3). Normal double progression is BACK ON - let it walk your loads back to pre-layoff (squat ~110, bench 40/hand, RDL 40/hand). The ONE hold: pogos return at 2x10, not 3x20 - tendon stiffness lags how strong you feel."},{"wk":3,"phase":"Return","strength":"Full jump volume. You should be at or past pre-layoff loads now - from here it's ordinary progression with no special handling."},{"wk":4,"phase":"Base","strength":"Full template, train it HARD - this is the strength window. Running: add the 4th day (easy 3-4 mi recovery run Sunday) and the first threshold work on Tuesday - 1 mile at threshold effort."},{"wk":5,"phase":"Base","strength":"Double progression running on every lift again. Threshold grows to 2 miles."},{"wk":6,"phase":"Base","strength":"Volume via MORE DAYS, not longer runs. Threshold 3 miles or 2x2. First marathon-pace segments in the Saturday long run - 2 x 10 min at 8:40-8:45/mi, late in the run."},{"wk":7,"phase":"Base","strength":"Last full week before Japan. Bank the consistency. Re-check the zone 2 HR number now that the heat is gone."},{"wk":8,"phase":"Japan","strength":"JAPAN - and these are REAL training weeks, not a write-off. Kuma's surgery. Strength = hotel gym / bodyweight (split squats, hip thrusts, push-ups, dead hangs, planks). Running continues normally."},{"wk":9,"phase":"Japan","strength":"Japan. Tokyo is extremely runnable and you're on the course. Keep the easy volume; strength is maintenance."},{"wk":10,"phase":"Japan","strength":"Japan. Hold the long run. Bodyweight strength 2-3x/wk is enough to keep what you built."},{"wk":11,"phase":"Japan","strength":"Japan / return home. Ease back into the loaded lifts - don't test yourself in week one back in the gym."},{"wk":12,"phase":"Build","strength":"TOKYO BUILD STARTS - 14 weeks out (an 18-week program would have started wk 8, in Japan). Lower A heavy 3-5, Lower B athletic. Strength starts trending toward maintenance from here."},{"wk":13,"phase":"Build","strength":"Quality proper: 800s are finally worth doing (Tue), threshold or marathon pace in the long run."},{"wk":14,"phase":"Build","strength":"Long run grows. Keep it under 30-35% of weekly mileage."},{"wk":15,"phase":"Build (down)","strength":"Down week. Take it - it's what makes the next block work."},{"wk":16,"phase":"Build","strength":"Marathon-effort miles inside the long run start here."},{"wk":17,"phase":"Build","strength":"Peak volume approaching. Lower body volume -1 set."},{"wk":18,"phase":"Build (down)","strength":"Down week."},{"wk":19,"phase":"Build","strength":"Longest sustained quality block."},{"wk":20,"phase":"Peak","strength":"Highest volume of the plan. Sleep and food are the session."},{"wk":21,"phase":"Peak","strength":"20-miler. Practice race fuelling exactly."},{"wk":22,"phase":"Peak","strength":"Last big week. Strength drops to maintenance."},{"wk":23,"phase":"Taper","strength":"Volume down ~35%, intensity stays. Legs get lighter, not lazier."},{"wk":24,"phase":"Taper","strength":"Volume down ~55%. Two short quality touches only."},{"wk":25,"phase":"RACE WEEK","strength":"TOKYO. Sun Mar 7. Shakeout only. Nothing to gain, everything to lose."}],"template":{"Monday":{"label":"Upper A - Push + Loaded Core","items":[{"ex":"Inchworm to Worlds Greatest","grp":"Warm-up","wt":"BW","sets":2,"reps":"5","rest":null,"notes":null,"desc":"Plus arm circles","cue":"Walk hands to plank, step foot outside hand, rotate and reach to the sky.","yt":"https://www.youtube.com/results?search_query=worlds+greatest+stretch+tutorial"},{"ex":"Bench Press","grp":"Upper Body","wt":null,"sets":4,"reps":"6-10","rest":120,"notes":null,"desc":"Main lift. Double progression: 4x8 then add weight. Stop 1-2 reps short of failure.","cue":"Feet planted, shoulder blades pinched, bar to mid-chest, press up and slightly back.","yt":"https://www.youtube.com/results?search_query=bench+press+proper+form"},{"ex":"Incline DB Press","grp":"Upper Body","wt":null,"sets":3,"reps":"8-12","rest":90,"notes":null,"desc":"Upper chest - the 'lean + defined' builder. Stop 1-2 reps short of failure.","cue":"Bench at 30-45°, elbows ~45° from body, deep stretch at the bottom, press up and in.","yt":"https://www.youtube.com/results?search_query=incline+dumbbell+press+form"},{"ex":"Machine Chest Flys","grp":"Upper Body","wt":null,"sets":3,"reps":"12-15","rest":60,"notes":null,"desc":"The fly pattern - the deep stretch pressing can't reach. Presses stop at your triceps and front delts. CYBEX VR1 FLY/REAR DELT machine: log the PIN NUMBER. It runs through a lever ratio so it is its own scale - do NOT compare it to your old cable numbers. Same machine does the rear delt work on Wednesday, just reversed.","cue":"Seat height so the handles sit at mid-chest, elbows soft and FIXED - this is not a press. Let the arms travel BACK until you feel the chest lengthen, pause a beat there, then squeeze to the middle. The stretched position is the whole point; most pec decks lose tension there, so don't cut the range short chasing weight.","yt":"https://www.youtube.com/results?search_query=pec+deck+machine+chest+fly+form"},{"ex":"Dips","grp":"Upper Body","wt":"BW","sets":3,"reps":"8-12","rest":90,"notes":null,"desc":"Replaces the overhead press here - OHP moved to Wednesday so you press on a FRESH shoulder. Lean forward slightly for chest, stay upright for triceps.","cue":"Slight forward lean, lower to 90° elbows, press to lockout.","yt":"https://www.youtube.com/results?search_query=chest+dips+proper+form"},{"ex":"Tricep Extensions","grp":"Upper Body","wt":null,"sets":3,"reps":"12-15","rest":60,"notes":"Superset w/ Pallof Press","desc":"Rope machine. Last set genuinely close to failure - that's where the growth is.","cue":"Elbows pinned to your sides, full lockout, slow return.","yt":"https://www.youtube.com/results?search_query=cable+tricep+pushdown+form"},{"ex":"Cable Crunch","grp":"Core / Mobility","wt":null,"sets":3,"reps":"10-15","rest":60,"notes":null,"desc":"MAIN ab builder. Progress it like bench: when you hit 3x15, add weight.","cue":"Kneel facing the stack, rope behind your head. Crunch by rounding your spine down toward your knees - hips stay put, it's all abs. THE ab mass builder because you can load it.","yt":"https://www.youtube.com/results?search_query=cable+crunch+proper+form"},{"ex":"Captain's Chair Knee Raises","grp":"Core / Mobility","wt":"BW","sets":3,"reps":"10-15","rest":60,"notes":null,"desc":"Progress the LEVERAGE, not the load: bent knees -> knees to chest with a pelvic tilt -> half-extended -> straight legs.","cue":"Forearms on the pads, back against the rest. Drive the knees toward your chest and curl the pelvis UP at the top - if your hips never move it's all hip flexor. Slow down, no swinging.","yt":"https://www.youtube.com/results?search_query=captains+chair+knee+raise+form"},{"ex":"Pallof Press","grp":"Core / Mobility","wt":null,"sets":3,"reps":"10/side","rest":45,"notes":null,"desc":"Anti-rotation - running posture.","cue":"Cable at chest height, press straight out and hold - resist the rotation.","yt":"https://www.youtube.com/results?search_query=pallof+press+form"},{"ex":"Interval Row","grp":"Cross-training","wt":null,"sets":1,"reps":"10'","rest":null,"notes":null,"desc":"2' easy, then 6x 30\" hard / 30\" easy.","cue":"Order is legs-body-arms; drive with the legs, arms come along last.","yt":"https://www.youtube.com/results?search_query=rowing+machine+technique"}]},"Tuesday":{"label":"Lower A - Heavy","items":[{"ex":"Body Weight Split Squat","grp":"Warm-up","wt":"BW","sets":2,"reps":"8","rest":null,"notes":null,"desc":"Plus leg swings","cue":"Long stance, back knee toward the floor, front heel planted.","yt":"https://www.youtube.com/results?search_query=split+squat+form"},{"ex":"Barbell Back Squat","grp":"Lower Body","wt":null,"sets":4,"reps":"3-5","rest":180,"notes":null,"desc":"THE lift. Leave 1-2 reps in the tank, always. NEW SCHEME: heavy triples/fives, 3 min rest, stop 1-2 reps short. Less soreness than 4x8 and better carryover to running. If a set feels grindy, that was the last one. SMITH MACHINE (Cybex). Convention: bar counted as 20 lb, log the TOTAL. Aug 14 baseline: 45/side + 20 = 110 for 3-5, called 'the right weight'. Do NOT compare this to a free-bar squat number.","cue":"Big breath, brace hard, sit down between your hips to parallel, drive mid-foot.","yt":"https://www.youtube.com/results?search_query=how+to+squat+proper+form"},{"ex":"Leg Press","grp":"Lower Body","wt":null,"sets":3,"reps":"6-10","rest":120,"notes":null,"desc":"Straight after squats. Where you pile on load with no technique or back cost. Also the clean substitute for squats on a beat-up week. Cybex VR1 SELECTORIZED - log the PIN NUMBER, not pounds. It runs through a lever ratio so the number isn't load at your feet; it only has to be consistent. Aug 14 baseline: 145 x 5 'felt like work' (after 6 mi of 800s + squats). Set the seat so the knee hits ~90 at the bottom without the hips tucking.","cue":"Feet mid-platform, shoulder width. Lower until your thighs are near your chest WITHOUT your low back rounding off the pad. Push through mid-foot. Never lock the knees out hard.","yt":"https://www.youtube.com/results?search_query=leg+press+proper+form"},{"ex":"Romanian Deadlifts","grp":"Lower Body","wt":null,"sets":3,"reps":"6-8","rest":150,"notes":null,"desc":"Hamstrings = late-race insurance Heavier than before to match the squat. Hips back, bar close, feel the hamstrings load. DUMBBELLS, per hand. DBs travel beside the legs so he can hinge further before anything jams. Aug 14 was the FIRST loaded bilateral RDL - capped at 40/hand on purpose because it was 40 h before a 12-miler and eccentric hamstring work is the single most reliable DOMS generator in the program. Next Lower A with no long run close behind: go find the real number.","cue":"Soft knees, push hips straight back, bar sliding down thighs, flat back, feel the hamstrings.","yt":"https://www.youtube.com/results?search_query=romanian+deadlift+proper+form"},{"ex":"Bulgarian Split Squats","grp":"Lower Body","wt":null,"sets":3,"reps":"8/leg","rest":90,"notes":null,"desc":"Hold DBs when 3x8 is easy Drop this one if the session is running long - leg press and squats are the priority.","cue":"Rear foot on bench, slight forward lean, drive through the front heel.","yt":"https://www.youtube.com/results?search_query=bulgarian+split+squat+form"},{"ex":"Standing Calf Raises","grp":"Lower Body","wt":null,"sets":2,"reps":"12-15/leg","rest":60,"notes":null,"desc":"Straight knee. Slow 3-sec lowering. Single leg, DB same-side hand. Aug 14 baseline: 25 lb x 10/leg x 2.","cue":"SINGLE LEG. Dumbbell in the hand on the WORKING side, other hand on a rail for balance. Full stretch at the bottom, pause at the top, 3-second lowering.","yt":"https://www.youtube.com/results?search_query=single+leg+calf+raise+dumbbell+form"},{"ex":"Tibialis Raises","grp":"Lower Body","wt":null,"sets":2,"reps":"15-20","rest":45,"notes":null,"desc":"Shin insurance LOADED with a kettlebell over the forefoot - his version, adopted. Precor KB rack is in POUNDS (10/15/20/25/35/45/50/60). Aug 14: start at 20. When 20 reps is easy, next KB up.","cue":"Seated on a bench, foot hanging over the edge, KETTLEBELL hooked over the forefoot (pad the handle with a towel - the bone there has no padding). 3-4 sec lowering, ~1 sec up. Full dorsiflexion at the top; the ankle's range is small and easy to cheat short.","yt":"https://www.youtube.com/results?search_query=seated+weighted+tibialis+raise+kettlebell"},{"ex":"Hip Adduction","grp":"Lower Body","wt":null,"sets":2,"reps":"12-15","rest":60,"notes":null,"desc":"VR1 stack number. Aug 14: start at 70.","cue":"Seated, squeeze the knees together, control the return. START THE RANGE MODERATE - a deep stretch on cold adductors is the classic groin tweak, and that's the one soft-tissue injury that actually interrupts running. Widen it over a few weeks.","yt":"https://www.youtube.com/results?search_query=hip+adduction+machine+form"},{"ex":"Hip Abduction","grp":"Lower Body","wt":null,"sets":2,"reps":"12-15","rest":60,"notes":null,"desc":"Glute medius. Keeps the pelvis level in single-leg stance - the pattern behind most IT band and lateral knee grumbles. VR1 stack number. Aug 14: start at 70. Full range is fine here.","cue":"Seated, push the knees apart against the pads. Slow on the way back in. This is glute medius - the muscle that stops your pelvis dropping on every stride.","yt":"https://www.youtube.com/results?search_query=hip+abduction+machine+form"}]},"Wednesday":{"label":"Upper C - Vertical Pull + Shoulders","items":[{"ex":"Inchworm Cobra Downward Dog","grp":"Warm-up","wt":"BW","sets":2,"reps":"5","rest":null,"notes":null,"desc":"Plus arm circles","cue":"Walk out to plank, hips down chest up, then push hips high.","yt":"https://www.youtube.com/results?search_query=inchworm+cobra+downward+dog+stretch"},{"ex":"Dead Hang","grp":"Back","wt":"BW","sets":3,"reps":"max","rest":60,"notes":null,"desc":"FIRST, on the freshest grip of the week. This is a tracked marker - log the seconds. Target 45-60s. Add seconds; at >30s clean, graduate to bar work.","cue":"Hang from the bar, arms straight, shoulders active (pulled slightly down). Build to 45-60 seconds.","yt":"https://www.youtube.com/results?search_query=dead+hang+benefits+how+to"},{"ex":"Pull-Up Negatives","grp":"Back","wt":"BW","sets":3,"reps":"3-5","rest":90,"notes":null,"desc":"Second, still fresh. Jump to the top, 4-5 sec down. Progress the TEMPO (lowering slower) before reps or load. THIS is what buys the first pull-up.","cue":"Step or jump to the top (chin over bar), then lower yourself as SLOWLY as you can - 3-5 seconds down. The fastest road to your first pull-up.","yt":"https://www.youtube.com/results?search_query=pull+up+negatives+tutorial"},{"ex":"Lat Pulldown","grp":"Back","wt":null,"sets":4,"reps":"8-12","rest":90,"notes":null,"desc":"VR1 stack number. The pull-up ladder - marching toward your ~150 lb bodyweight. Aug 7 was 4x12 @ 70.","cue":"Lean back slightly, pull bar to upper chest, elbows down not back.","yt":"https://www.youtube.com/results?search_query=lat+pulldown+form"},{"ex":"Overhead Shoulder Press","grp":"Shoulders","wt":null,"sets":3,"reps":"6-10","rest":120,"notes":null,"desc":"MOVED HERE from Monday. On Monday it landed 4th after bench, incline and flys had already cooked the front delt. Here you press fresh. Stop 1-2 reps short.","cue":"Squeeze glutes, ribs down, press to lockout with biceps by ears.","yt":"https://www.youtube.com/results?search_query=overhead+press+proper+form"},{"ex":"Lateral Raises","grp":"Shoulders","wt":null,"sets":3,"reps":"12-15","rest":60,"notes":null,"desc":"Light, strict, chase the burn. Last set genuinely close to failure.","cue":"Slight elbow bend, lead with elbows to shoulder height, zero swinging.","yt":"https://www.youtube.com/results?search_query=lateral+raise+proper+form"},{"ex":"Rear Delt Flys","grp":"Shoulders","wt":null,"sets":3,"reps":"12-15","rest":60,"notes":null,"desc":"Rear delts + posture. Keep these forever.","cue":"Hinge forward, light weight, lead with pinkies out wide.","yt":"https://www.youtube.com/results?search_query=rear+delt+fly+form"},{"ex":"Bicep Curls","grp":"Upper Body","wt":null,"sets":3,"reps":"10-15","rest":60,"notes":"Superset w/ hammer curls","desc":"Last set genui ch by rounding your spine down toward your knees - hips stay put, it's all abs. THE ab mass builder because you can load it.","yt":"https://www.youtube.com/results?search_query=cable+crunch+proper+form"},{"ex":"Captain's Chair Knee Raises","grp":"Core / Mobility","wt":"BW","sets":2,"reps":"10-15","rest":60,"notes":null,"desc":"Progress the LEVERAGE, not the load: bent knees -> knees to chest with a pelvic tilt -> half-extended -> straight legs.","cue":"Forearms on the pads, back against the rest. Drive the knees toward your chest and curl the pelvis UP at the top - if your hips never move it's all hip flexor. Slow down, no swinging.","yt":"https://www.youtube.com/results?search_query=captains+chair+knee+raise+form"},{"ex":"Pallof Press","grp":"Core / Mobility","wt":null,"sets":2,"reps":"10/side","rest":45,"notes":null,"desc":"Anti-rotation - running posture.","cue":"Cable at chest height, press straight out and hold - resist the rotation.","yt":"https://www.youtube.com/results?search_query=pallof+press+form"},{"ex":"Interval Row","grp":"Cross-training","wt":null,"sets":1,"reps":"10'","rest":null,"notes":null,"desc":"2' easy, then 6x 30\" hard / 30\" easy.","cue":"Order is legs-body-arms; drive with the legs, arms come along last.","yt":"https://www.youtube.com/results?search_query=rowing+machine+technique"}]},"Tuesday":{"label":"4 mi EASY  |  Lower A - REDUCED","items":[{"ex":"Body Weight Split Squat","grp":"Warm-up","wt":"BW","sets":2,"reps":"8","rest":null,"notes":null,"desc":"Plus leg swings","cue":"Long stance, back knee toward the floor, front heel planted.","yt":"https://www.youtube.com/results?search_query=split+squat+form"},{"ex":"Barbell Back Squat","grp":"Lower Body","wt":null,"sets":3,"reps":"3-5","rest":180,"notes":null,"desc":"THE lift. Leave 1-2 reps in the tank, always. NEW SCHEME: heavy triples/fives, 3 min rest, stop 1-2 reps short. Less soreness than 4x8 and better carryover to running. If a set feels grindy, that was the last one. SMITH MACHINE (C -up","wt":"BW","sets":2,"reps":"5","rest":null,"notes":null,"desc":"Plus arm circles","cue":"Walk out to plank, hips down chest up, then push hips high.","yt":"https://www.youtube.com/results?search_query=inchworm+cobra+downward+dog+stretch"},{"ex":"Dead Hang","grp":"Back","wt":"BW","sets":3,"reps":"max","rest":60,"notes":null,"desc":"FIRST, on the freshest grip of the week. This is a tracked marker - log the seconds. Target 45-60s. Add seconds; at >30s clean, graduate to bar work.","cue":"Hang from the bar, arms straight, shoulders active (pulled slightly down). Build to 45-60 seconds.","yt":"https://www.youtube.com/results?search_query=dead+hang+benefits+how+to"},{"ex":"Pull-Up Negatives","grp":"Back","wt":"BW","sets":2,"reps":"3-5","rest":90,"notes":null,"desc":"Second, still fresh. Jump to the top, 4-5 sec down. Progress the TEMPO (lowering slower) before reps or load. THIS is what buys the first pull-up.","cue":"Step or jump to the top (chin over bar), then lower yourself as SLOWLY as you can - 3-5 seconds down. The fastest road to your first pull-up.","yt":"https://www.youtube.com/results?search_query=pull+up+negatives+tutorial"},{"ex":"Lat Pulldown","grp":"Back","wt":null,"sets":3,"reps":"8-12","rest":90,"notes":null,"desc":"VR1 stack number. The pull-up ladder - marching toward your ~150 lb bodyweight. Aug 7 was 4x12 @ 70.","cue":"Lean back slightly, pull bar to upper chest, elbows down not back.","yt":"https://www.youtube.com/results?search_query=lat+pulldown+form"},{"ex":"Overhead Shoulder Press","grp":"Shoulders","wt":null,"sets":2,"reps":"6-10","rest":120,"notes":null,"desc":"MOVED HERE from Monday. On Monday it landed 4th after bench, incline and flys had already cooked the front delt. Here you press fresh. Stop 1-2 reps short.","cue":"Squeeze glutes, ribs down, press to lockout with biceps by ears.","yt":"https://www.youtube.com/results?search_query=overhead+press+proper+form"},{"ex":"Lateral Raises","grp":"Shoulders","wt":null,"sets":2,"reps":"12-15", "rest":90,"notes":null,"desc":"Knee-height box, control the way down","cue":"Whole foot on a knee-height box, drive through the heel, control the way down.","yt":"https://www.youtube.com/results?search_query=dumbbell+step+up+form"},{"ex":"Single-Leg RDL","grp":"Lower Body","wt":"BW","sets":2,"reps":"8/leg","rest":90,"notes":null,"desc":"WEEK 1: BODYWEIGHT ONLY. Lower A had bilateral DB RDLs 48h ago - same tissue, same eccentric pattern - and this one's real job is balance anyway. Load it from week 2.","cue":"Hinge at the hip, back flat, reach toward the floor, squeeze the glute to stand.","yt":"https://www.youtube.com/results?search_query=single+leg+romanian+deadlift+form"},{"ex":"Seated Calf Raises","grp":"Lower Body","wt":null,"sets":2,"reps":"12-15","rest":60,"notes":null,"desc":"Soleus - the marathon muscle","cue":"Bent knee hits the soleus - slow, full range.","yt":"https://www.youtube.com/results?search_query=seated+calf+raise+form"},{"ex":"Leg Press Ankle-Iso Push","grp":"Lower Body","wt":null,"sets":2,"reps":"4","rest":60,"notes":null,"desc":"Push hard 4 sec, rest 4 sec, x4 = 1 set","cue":"Push hard into the sled through your toes for 4 sec, rest 4 sec, repeat x4 = 1 set.","yt":"https://www.youtube.com/results?search_query=isometric+calf+push+leg+press"},{"ex":"Copenhagen Plank","grp":"Core / Mobility","wt":"BW","sets":2,"reps":"20-30s","rest":45,"notes":null,"desc":"Do this one properly this week - it's carrying the load the pogos would have. Progress the LEVER (knee-supported -> mid-shin -> full top-foot), never the weight.","cue":"Top leg on a bench, lift hips into a side plank - start from the knee.","yt":"https://www.youtube.com/results?search_query=copenhagen+plank+tutorial"},{"ex":"Stretching","grp":"Core / Mobility","wt":null,"sets":null,"reps":null,"rest":null,"notes":null,"desc":"10 min after: hips, hamstrings, calves.","cue":"Hit quads, hamstrings, calves, hips - 30-45s per hold.","yt":"https://www.youtube.com/results?search_query=post+run+stretching+routine"}]}}},"fuel":{"days":{"Monday":{"cal":2600,"type":"Lift day","carb":"Moderate carbs","note":"Upper A (push + core) + row. Normal training day.","k":"lift"},"Tuesday":{"cal":2900,"type":"HARD day - quality run + legs","carb":"High carbs","note":"THE quality day: hard run + Lower A heavy. Underfueling today ruins both.","k":"hard"},"Wednesday":{"cal":2600,"type":"Lift day","carb":"Moderate carbs","note":"Upper C - pull-up work first while fresh, shoulders, carries last.","k":"lift"},"Thursday":{"cal":2750,"type":"Run + lift","carb":"Moderate-high carbs","note":"EASY run + Lower B. This run stays easy permanently - it's what pays for Tue and Sat.","k":"runlift"},"Friday":{"cal":2600,"type":"Lift day","carb":"Moderate carbs","note":"Upper B - horizontal pull + obliques, optional zone 2 row.","k":"lift"},"Saturday":{"cal":null,"type":"LONG RUN day","carb":"High carbs","note":"Calories scale with long-run distance - shown above."},"Sunday":{"cal":2400,"type":"Recovery day","carb":"Moderate carbs","note":"Mobility. From wk 4, an easy 3-4 mi recovery run. Creatine, protein, early night.","k":"rest"}},"weekDays":{"1":{"Monday":{"cal":2500,"kind":"lift","type":"Upper A (reduced)","carb":"Moderate carbs","note":"First session in a month. Leave 3 reps in the tank on everything. Bench: last time 40/hand x10 - start at 35."},"Tuesday":{"cal":2800,"kind":"hard","type":"4 mi easy + Lower A (reduced)","carb":"High carbs","note":"Squats: Smith, bar counted as 20. Last time 110 - start at 90-95. HEELS ELEVATED on 5s or 10s for depth (prescribed Aug 14, never tried). DB RDLs: 30/hand, not 40."},"Wednesday":{"cal":2500,"kind":"lift","type":"Upper C (reduced)","carb":"Moderate carbs","note":"Dead hang FIRST - freshest grip of the week, log the seconds. Lat pulldown: start back at 70. OHP moved here: 25, not 30."},"Thursday":{"cal":2700,"kind":"lift","type":"4-6 mi easy + Lower B (reduced)","carb":"Moderate-high carbs","note":"No pogos this week. Single-leg RDL bodyweight only ],["Snacks that move the needle",["Core Power (240 cal, 42g protein)","Greek yogurt cup (~120 cal, 15g)","Beef jerky (~80 cal, 13g)","PB + banana toast pre-run (~300 cal)","Chocolate milk after long runs"]]],"raceWeek":"RACE WEEK: Thu-Sat carb load - push carbs to ~450-550g/day (rice, pasta, bread, juice - low fiber), keep protein at 150g, don't chase new foods. Race morning: your practiced breakfast 3h before, gel every 35-40 min during, salt if hot. Nothing new on race day.","bwLb":150,"kcalPerLb":{"rest":15.3,"lift":17.3,"runlift":18.3,"hard":19.3},"proteinPerLb":1,"longPerMilePerLb":0.4},"groups":{"Upper Body":["Bench Press","Incline Bench Press","Incline DB Press","DB Bench Press","Machine Chest Flys","Cable Chest Flys","Dips","Push-ups","Close-Grip Bench Press","Tricep Extensions","Overhead Tricep Extension","Skullcrushers","Bicep Curls","Hammer Curls","Incline DB Curls"],"Back":["Seated Row","Dumbbell Row","Single Arm Bent Over Row","Barbell Row","Chest-Supported Row","Lat Pulldown","Pull-Up","Chin-Up","Weighted Pull-Up","Cable Face Pulls","Straight-Arm Pulldown","Shrugs","Pull-Up Negatives","Dead Hang","Scap Pulls","Inverted Row"],"Lower Body":["Barbell Back Squat","Front Squat","Goblet Squat","Deadlifts","Trap Bar Deadlift","Romanian Deadlifts","Single-Leg RDL","Bulgarian Split Squats","Walking Lunges","Step-Ups","Hip Thrusts","Glute Bridge","Leg Press","Leg Press Ankle-Iso Push","Leg Curl","Leg Extension","Hip Abduction","Hip Adduction","Standing Calf Raises","Seated Calf Raises","Tibialis Raises","Single-Leg Hip Thrust"],"Shoulders":["Overhead Shoulder Press","DB Shoulder Press","Arnold Press","Front Raises","Lateral Raises","Cable Lateral Raises","Rear Delt Flys","Upright Row"],"Core / Mobility":["Planks","Planks w/ Reach","Planks w/ Shoulder Taps","Side Planks","Copenhagen Plank","Pallof Press","Russian Twists","Dead Bugs","Bird Dogs","Hanging Leg Raises","Ab Wheel Rollout","Back Extensions","Cable Wood Chops","Stretching","Foam Rolling","Cable Crunch","Weighted Plank","Hanging Knee Raises","Suitcase Carry","Decline Sit-Up","Captain's Chair Knee Raises"],"Cross-training":["Zone 2 Row","Interval Row","Jumprope","Pogos","Box Jumps","A-Skips","Stair Climber","Incline Walk","Swimming"],"Warm-up":["Inchworm to Worlds Greatest","Elbow to Opposite Knee Marching","Body Weight Split Squat","Inchworm Cobra Downward Dog","Scap Push-ups","Arm Circles","Leg Swings","90/90 Hip Openers","Ankle Rocks","Glute Bridges"]},"perHand":["Incline DB Press","DB Bench Press","DB Shoulder Press","Arnold Press","Incline DB Curls","Hammer Curls","Bicep Curls","Dumbbell Row","Single Arm Bent Over Row","Lateral Raises","Front Raises","Rear Delt Flys","Bulgarian Split Squats","Walking Lunges","Step-Ups","Single-Leg RDL","Shrugs","Chest-Supported Row","Romanian Deadlifts"],"cardio":["Zone 2 Row","Interval Row","Jumprope","Stair Climber","Incline Walk","Swimming"],"cues":{"Bench Press":"Feet planted, shoulder blades pinched, bar to mid-chest, press up and slightly back.","Incline DB Press":"Bench at 30-45°, elbows ~45° from body, deep stretch at the bottom, press up and in.","Incline Bench Press":"Bench at 30-45°, bar to upper chest, elbows under the bar.","Overhead Shoulder Press":"Squeeze glutes, ribs down, press to lockout with biceps by ears.","DB Shoulder Press":"Slight arc up and in, don't flare ribs, full lockout.","Lateral Raises":"Slight elbow bend, lead with elbows to shoulder height, zero swinging.","Front Raises":"Raise to eye level, thumbs slightly up, no momentum.","Rear Delt Flys":"Hinge forward, light weight, lead with pinkies out wide.","Tricep Extensions":"Elbows pinned to your sides, full lockout, slow return.","Skullcrushers":"Lower the bar to forehead or just behind, elbows tucked in.","Bicep Curls":"Elbows glued to sides, full range, control the lowering.","Hammer Curls":"Neutral grip, squeeze at the top, no swinging.","Incline DB Curls":"Let arms hang back for the stretch, curl without moving shoulders.","Dips":"Slight forward lean, lower to 90° elbows, press to lockout.","Cable Chest Flys":"Slight forward lean, elbows soft and FIXED - this is not a press. Squeeze the hands together in front of the sternum. PAUSE in the stretched position; that's where the growth stimulus is. Go light enough that the stretch is controlled.","Pull-Up":"From a dead hang, drive elbows down, chin clears the bar, control the descent.","Lat Pulldown":"Lean back slightly, pull bar to upper chest, elbows down not back.","Chest-Supported Row":"Chest stays on the pad, pull elbows back, 1-sec squeeze.","Single Arm Bent Over Row":"Flat back, pull to your hip, no torso twist.","Seated Row":"Tall chest, pull to belly button, squeeze shoulder blades.","Cable Face Pulls":"Pull rope to your face, elbows high, finish thumbs-back.","Pallof Press":"Cable at chest height, press straight out and hold - resist the rotation.","Dead Bugs":"Low back glued to the floor, opposite arm and leg, slow.","Side Planks":"Straight line ear to ankle, hips high, don't let them sag.","Bird Dogs":"Opposite arm and leg, hips stay level, pause at full reach.","Russian Twists":"Tall chest, rotate the shoulders not just the arms.","Hanging Leg Raises":"No swinging - curl the pelvis up, control the way down.","Copenhagen Plank":"Top leg on a bench, lift hips into a side plank - start from the knee.","Pull-Up Negatives":"Step or jump to the top (chin over bar), then lower yourself as SLOWLY as you can - 3-5 seconds down. The fastest road to your first pull-up.","Dead Hang":"Hang from the bar, arms straight, shoulders active (pulled slightly down). Build to 45-60 seconds.","Scap Pulls":"From a dead hang, pull your shoulder blades down and together WITHOUT bending your elbows - your body rises an inch or two.","Inverted Row":"Bar at waist height (Smith machine works), body straight underneath, pull chest to bar. Feet elevated = harder.","Barbell Back Squat":"Big breath, brace hard, sit down between your hips to parallel, drive mid-foot.","Romanian Deadlifts":"Soft knees, push hips straight back, bar sliding down thighs, flat back, feel the hamstrings.","Bulgarian Split Squats":"Rear foot on bench, slight forward lean, drive through the front heel.","Standing Calf Raises":"SINGLE LEG. Dumbbell in the hand on the WORKING side, other hand on a rail for balance. Full stretch at the bottom, pause at the top, 3-second lowering.","Seated Calf Raises":"Bent knee hits the soleus - slow, full range.","Tibialis Raises":"Seated on a bench, foot hanging over the edge, KETTLEBELL hooked over the forefoot (pad the handle with a towel - the bone there has no padding). 3-4 sec lowering, ~1 sec up. Full dorsiflexion at the top; the ankle's range is small and easy to cheat short.","Hip Adduction":"Seated, squeeze the knees together, control the return. START THE RANGE MODERATE - a deep stretch on cold adductors is the classic groin tweak, and that's the one soft-tissue injury that actually interrupts running. Widen it over a few weeks.","Hip Abduction":"Seated, push the knees apart against the pads. Slow on the way back in. This is glute medius - the muscle that stops your pelvis dropping on every stride.","Hip Thrusts":"Upper back on bench, chin tucked, squeeze glutes to full lockout, 1-sec hold.","Step-Ups":"Whole foot on a knee-height box, drive through the heel, control the way down.","Single-Leg RDL":"Hinge at the hip, back flat, reach toward the floor, squeeze the glute to stand.","Leg Press Ankle-Iso Push":"Push hard into the sled through your toes for 4 sec, rest 4 sec, repeat x4 = 1 set.","Pogos":"Stiff ankles, bounce like a spring off the ground, minimal knee bend, quick contacts.","Interval Row":"Order is legs-body-arms; drive with the legs, arms come along last.","Zone 2 Row":"Easy sustainable pace - you should be able to talk. Legs drive, arms follow.","Inchworm to Worlds Greatest":"Walk hands to plank, step foot outside hand, rotate and reach to the sky.","Elbow to Opposite Knee Marching":"Tall posture, slow controlled march, elbow to opposite knee.","Body Weight Split Squat":"Long stance, back knee toward the floor, front heel planted.","Inchworm Cobra Downward Dog":"Walk out to plank, hips down chest up, then push hips high.","Stretching":"Hit quads, hamstrings, calves, hips - 30-45s per hold.","Cable Crunch":"Kneel facing the stack, rope behind your head. Crunch by rounding your spine down toward your knees - hips stay put, it's all abs. THE ab mass builder because you can load it.","Ab Wheel Rollout":"From knees, ribs pulled down, roll out only as far as you can WITHOUT your low back sagging. Come back by pulling with the abs, not the arms.","Weighted Plank":"Standard plank with a plate on your upper back. Squeeze glutes, ribs down, no sagging.","Hanging Knee Raises":"Easier version of the leg raise - knees to chest, curl the pelvis up at the top, no swinging. Progress to straight legs.","Suitcase Carry":"Heavy dumbbell in ONE hand, walk tall without leaning. Obliques fight the tilt. Brutal and great for running posture.","Cable Wood Chops":"Rotate from the torso, arms stay long, pivot the back foot. Control it back - don't let the stack yank you.","Decline Sit-Up":"Hold a plate at your chest, roll up one vertebra at a time, control the way down.","Single-Leg Hip Thrust":"Upper back on bench, one foot planted, other leg lifted. Drive through the heel to full lockout, squeeze 1 sec. Add a DB on the hip when 3x10 gets easy.","Leg Press":"Feet mid-platform, shoulder width. Lower until your thighs are near your chest WITHOUT your low back rounding off the pad. Push through mid-foot. Never lock the knees out hard.","Captain's Chair Knee Raises":"Forearms on the pads, back against the rest. Drive the knees toward your chest and curl the pelvis UP at the top - if your hips never move it's all hip flexor. Slow down, no swinging.","Machine Chest Flys":"Seat height so the handles sit at mid-chest, elbows soft and FIXED - this is not a press. Let the arms travel BACK until you feel the chest lengthen, pause a beat there, then squeeze to the middle. The stretched position is the whole point; most pec decks lose tension there, so don't cut the range short chasing weight."}};
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const KEY = "nyc26-log-v1";

// ---------- storage (localStorage with in-memory fallback) ----------
let mem = {}, canStore = false;
try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); canStore = true; } catch(e) {}
function loadDB(){ if(canStore){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } } return mem; }
function saveDB(db){ if(canStore){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} } mem = db; }
let DB = loadDB();   // { "YYYY-MM-DD": { "Exercise Name": {sets:[{w,r,done}], note:""} } }

// ---------- date helpers ----------
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); }
const WEEK1 = parseISO(PLAN.week1), RACE = parseISO(PLAN.race);
function weekOf(d){ return Math.floor((d - WEEK1)/(7*864e5)) + 1; }
function mondayOfWeek(n){ const d = new Date(WEEK1); d.setDate(d.getDate()+(n-1)*7); return d; }
let viewDate = new Date(); viewDate.setHours(0,0,0,0);
let tab = "today", histEx = null;

// ---------- phase logic ----------
function weekInfo(n){ return PLAN.weeks.find(w=>w.wk===n) || null; }
// user plan edits (from the in-app editor) — highest precedence
let planEdits = {};
try{ planEdits = JSON.parse(localStorage.getItem(KEY+"-plan")||"{}"); }catch(e){}
function savePlanEdits(){ try{ localStorage.setItem(KEY+"-plan", JSON.stringify(planEdits)); }catch(e){} }
function dayPlan(n, dayName){
  if(planEdits[dayName]) return planEdits[dayName];
  const o = PLAN.overrides && PLAN.overrides[String(n)];
  return (o && o[dayName]) || PLAN.template[dayName];
}
function allTemplates(){
  const list = [PLAN.template];
  if(PLAN.overrides) Object.values(PLAN.overrides).forEach(o=>list.push(o));
  return list;
}
function phaseAdjust(n){
  const wi = weekInfo(n); if(!wi) return null;
  if(wi.phase.startsWith("Peak")) return {lower:-1, note:"PEAK: drop 1 set from every lower-body lift. Same weights — you're maintaining, the running is the point now."};
  if(wi.phase.includes("down")||wi.phase==="Build (down)") return {lower:-1, upper:-1, note:"DOWN WEEK: −1 set on everything, same weights. Recovery is training."};
  if(wi.phase==="Taper") return {lower:-99, note:"TAPER: follow the strength notes on the Plan tab — lower body is winding down."};
  if(wi.phase==="RACE WEEK") return {lower:-99, upper:-99, note:"RACE WEEK. Bodyweight circuit Monday only. Nothing after Tuesday. Trust the taper."};
  return null;
}

// ---------- rendering ----------
function go(t){ tab=t; document.querySelectorAll("nav button").forEach(b=>b.classList.remove("on"));
  document.getElementById("nav-"+t).classList.add("on"); render(); window.scrollTo(0,0); }

function render(){
  const today = new Date(); today.setHours(0,0,0,0);
  const wkN = weekOf(today);
  const daysLeft = Math.round((RACE-today)/864e5);
  document.getElementById("subhead").innerHTML =
    (wkN>=1&&wkN<=25 ? `Week ${wkN} of 25 · ` : "") + `<span class="countdown">${daysLeft>0?daysLeft+" days to Tokyo":(daysLeft===0?"RACE DAY 🎉":"Race complete")}</span>`;
  const wi = weekInfo(Math.min(Math.max(weekOf(viewDate),1),25));
  const pb = document.getElementById("phaseband");
  if(wi && tab!=="data" && tab!=="history" && tab!=="summary" && tab!=="editor"){
    pb.style.display="block";
    pb.innerHTML = `<b>Week ${wi.wk} — ${wi.phase}</b><br>${wi.strength}`;
  } else pb.style.display="none";
  document.querySelector("nav").style.display = (tab==="summary") ? "none" : "flex";
  document.querySelector("header").style.display = (tab==="summary") ? "none" : "block";
  const m = document.getElementById("main");
  if(tab==="today") m.innerHTML = renderToday();
  else if(tab==="editor") m.innerHTML = renderEditor();
  else if(tab==="summary") m.innerHTML = renderSummary();
  else if(tab==="fuel") m.innerHTML = renderFuel();
  else if(tab==="week") m.innerHTML = renderWeek();
  else if(tab==="history"){ m.innerHTML = renderHistory(); const s=document.getElementById("histsel"); if(s) s.value = histEx||""; }
  else if(tab==="plan") m.innerHTML = renderPlan();
  else m.innerHTML = renderData();
}

function dayNav(){
  const start = new Date(viewDate); start.setDate(start.getDate()-3);
  let h = '<div class="daynav">';
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(d.getDate()+i);
    const on = iso(d)===iso(viewDate);
    h += `<button class="daybtn ${on?"on":""}" onclick="setDate('${iso(d)}')">${DAYS[(d.getDay()+6)%7].slice(0,3)}<span class="dd">${d.getDate()}</span></button>`;
  }
  return h+"</div>";
}
function setDate(s){ viewDate = parseISO(s); render(); }

function lastPerf(ex, beforeISO){
  const dates = Object.keys(DB).filter(d=>d<beforeISO && DB[d][ex] && DB[d][ex].sets && DB[d][ex].sets.some(s=>s.done)).sort();
  if(!dates.length) return null;
  const d = dates[dates.length-1], sets = DB[d][ex].sets.filter(s=>s.done);
  return {date:d, sets, note:DB[d][ex].note||""};
}
function lastCardio(ex, beforeISO){
  const dates = Object.keys(DB).filter(d=>d<beforeISO && DB[d][ex] && DB[d][ex].cardio && DB[d][ex].cardio.done).sort();
  if(!dates.length) return null;
  const d = dates[dates.length-1];
  return {date:d, ...DB[d][ex].cardio, note:DB[d][ex].note||""};
}
function fmtSets(sets){ return sets.map(s=>`${s.w||"BW"}×${s.r}`).join(", "); }

// Coach line: reads last performance + target range and says what to do TODAY.
// Double progression: reps to the top of the range on every set -> add weight, reps reset.
const NO_COACH = ["Stretching","Foam Rolling","Full Rest Day","Long Run - 12 mi"];
// v16: exercises where progression is LEVERAGE or TEMPO, not load. The generic double-progression
// line ("go up 5 lb") is wrong for these - resistance is a function of the moment arm, so
// straightening the lever raises the demand far more, and more smoothly, than clipping a weight on.
const LEVER = {
  "Captain's Chair Knee Raises":
    "Ladder: bent knees \u2192 knees to chest with a deliberate pelvic tilt \u2192 half-extended \u2192 straight legs. Only add load once you own straight-leg for a full set. Mechanical drop set works well: straight legs to failure, then bend the knees and keep going in the same set.",
  "Hanging Leg Raises":
    "Ladder: bent knees \u2192 knees to chest w/ pelvic tilt \u2192 half-extended \u2192 straight legs \u2192 toes to bar. Lengthen the lever before you add weight.",
  "Dead Bugs":
    "Progress tempo and lever, not load: slower, legs straighter, heel closer to the floor. If it's easy it's too short a lever.",
  "Copenhagen Plank":
    "Progress the lever: knee-supported \u2192 mid-shin \u2192 full top-foot support. Add time only once the position is solid.",
  "Pull-Up Negatives":
    "Progress the TEMPO: make the lowering slower (work toward 5-8 s) before adding reps or load. That's what buys the first pull-up.",
  "Dead Hang":
    "Add seconds. At >30 s clean, graduate to bar work.",
  "Pogos":
    "Progress stiffness and height, never load. Minimal ground contact time - think hot pavement."
};
function deloadWeek(){
  var n = Math.min(Math.max(weekOf(viewDate),1),PLAN.weeks.length);
  var w = PLAN.weeks.find(function(x){ return x.wk===n; });
  return !!(w && w.dl);
}
function coachTip(it, last, targetSets){
  if(!last || !last.sets.length) return "";
  // no progression prompts on warm-ups, mobility or non-loadable work
  if(!it.grp || it.grp==="Warm-up" || NO_COACH.includes(it.ex)) return "";
  const top = midReps(it.reps);              // top of target range
  const nums = String(it.reps||"").match(/\d+/g) || [];
  const bottom = nums.length ? parseInt(nums[0]) : null;
  const reps = last.sets.map(s=>parseInt(s.r)).filter(n=>!isNaN(n));
  if(!reps.length) return "";
  const best = Math.max(...reps);
  if(LEVER[it.ex]){
    const unit = isTimeBased(it.reps) ? "s" : " reps";
    return `<div class="coach">\u2b06 Progress the LEVERAGE, not the load \u2014 last: ${best}${unit}. ${LEVER[it.ex]}</div>`;
  }
  if(deloadWeek()){
    const _u = isTimeBased(it.reps) ? "s" : " reps";
    const _w = (last.sets.filter(s=>s.w!==""&&s.w!=null)[0]||{}).w;
    return `<div class="coach">\u21a9 RETURN WEEK \u2014 do NOT chase the jump. Last time: ${_w?_w+" \u00d7 ":""}${best}${_u}. Repeat that weight at fewer sets, or go ~15% lighter, and leave 3 reps in the tank. Progression resumes when the plan says so.</div>`;
  }
  if(isTimeBased(it.reps)){
    return `<div class="coach">⬆ Beat ${best}s on at least one hold today.</div>`;
  }
  if(!top) return "";
  const ws = last.sets.map(s=>parseFloat(s.w)).filter(n=>!isNaN(n));
  const w = ws.length ? Math.max(...ws) : null;
  const enough = last.sets.length >= Math.min(targetSets||last.sets.length, last.sets.length);
  const allTop = enough && reps.every(r=>r>=top);
  if(w===null){ // bodyweight
    return allTop
      ? `<div class="coach">⬆ Topped out at bodyweight — add load (DB on hip / between feet) or add a rep beyond ${top}.</div>`
      : `<div class="coach">🎯 Beat last time: get every set to ${top}, then we load it.</div>`;
  }
  if(allTop){
    const inc = PLAN.perHand.includes(it.ex) ? 5 : 5;
    return `<div class="coach">⬆ Every set hit ${top} at ${w} — go up today (smallest jump, ~${w+inc}${PLAN.perHand.includes(it.ex)?"/hand":""}). Reps will drop back toward ${bottom??"the bottom"} — that's correct.</div>`;
  }
  return `<div class="coach">🎯 Stay at ${w} — add a rep somewhere (last: ${reps.join(", ")}). At ${top}s across the board you go up.</div>`;
}
function isCardio(ex){ return PLAN.cardio.includes(ex); }
// v14: ONE resolved weight per set, used by the input, the +/- buttons AND as the seed when a set
// gets created. Previously the box showed a "ghost" prefill that nothing had stored, so writing to
// the set threw it away (weight disappeared), minus fell back to 0, and plus added 5 on top of a
// value the user couldn't see (70 -> 80 style jumps).
// Priority: stored weight -> last non-empty set EARLIER TODAY -> last session same index -> last session set 1.
function resolveW(log, last, i){
  const nz = v => (v !== "" && v !== null && v !== undefined && !isNaN(parseFloat(v)));
  if(log && log.sets[i] && nz(log.sets[i].w)) return log.sets[i].w;
  if(log){ for(let k=i-1;k>=0;k--){ if(log.sets[k] && nz(log.sets[k].w)) return log.sets[k].w; } }
  if(last && last.sets[i] && nz(last.sets[i].w)) return last.sets[i].w;
  if(last && last.sets[0] && nz(last.sets[0].w)) return last.sets[0].w;
  return "";
}
function unitFor(ex){ return PLAN.perHand.includes(ex) ? "lb/hand" : "lb"; }
function midReps(repsStr){
  // despite the name: returns the TOP of the target range (6-8 -> 8) per Adam's preference
  if(repsStr===null||repsStr===undefined) return null;
  const nums = String(repsStr).match(/\d+/g);
  if(!nums) return null;
  return parseInt(nums[nums.length-1]);
}
function isTimeBased(repsStr){ return /\ds|max|sec/i.test(String(repsStr||"")); }
function cueFor(it){ return it.cue || (PLAN.cues && PLAN.cues[it.ex]) || null; }
function ytFor(it){
  if(it.yt) return it.yt;
  if(!it.grp) return null;
  return "https://www.youtube.com/results?search_query="+encodeURIComponent(it.ex+" exercise form");
}

function renderToday(){
  const dISO = iso(viewDate);
  const dayName = DAYS[(viewDate.getDay()+6)%7];
  const wkN = weekOf(viewDate);
  const t = dayPlan(wkN, dayName);
  const adj = (wkN>=1&&wkN<=14) ? phaseAdjust(wkN) : null;
  let h = dayNav();
  const f = fuelFor(viewDate);
  h += `<div class="card" style="padding:10px 14px;cursor:pointer" onclick="go('fuel')">
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px">
      <span>🍽️ <b>${f.cal.toLocaleString()} cal</b> · ${proteinTarget()}g protein</span>
      <span style="color:var(--dim);font-size:11.5px">${f.carb} →</span>
    </div></div>`;
  h += `<div class="session-label">${dayName} — ${t.label}</div>`;
  if(adj) h += `<div class="warn">${adj.note}</div>`;
  if(wkN<1||wkN>25) h += `<div class="warn">This date is outside the 25-week plan (Sep 14 – Mar 7). Showing the standard template.</div>`;
  h += runCard(dISO, t.label);
  t.items.forEach(it=>{
    if(!it.grp && it.ex==="Full Rest Day"){
      h += `<div class="card"><div class="ex-name">😴 ${wkN===1&&dayName==="Monday"?"Recovery Day":"Full Rest Day"}</div><div class="desc">${it.desc}</div></div>`; return;
    }
    h += exCard(it, dISO, adj);
  });
  // added exercises
  const extras = (DB[dISO] && DB[dISO].__extra) || [];
  extras.forEach((x,i)=>{
    h += exCard({ex:x.ex, grp:x.grp, wt:null, sets:3, reps:"8-12", rest:60,
      yt:"https://www.youtube.com/results?search_query="+encodeURIComponent(x.ex+" exercise form"),
      extraIdx:i}, dISO, adj);
  });
  // add-exercise UI
  if(addxOpen){
    const grps = Object.keys(PLAN.groups);
    const g = addxGrp || grps[0];
    const customs = customExercises();
    h += `<div class="card"><div style="font-weight:700;font-size:13px;margin-bottom:8px">Add an exercise</div>
      <select id="addx-grp" onchange="addxSetGrp(this.value)">${grps.map(x=>`<option ${x===g?"selected":""}>${x}</option>`).join("")}</select>
      <select id="addx-ex">${PLAN.groups[g].map(x=>`<option>${x}</option>`).join("")}${customs.map(x=>`<option>${x}</option>`).join("")}<option value="__custom__">✏️ Type my own…</option></select>
      <input id="addx-custom" class="cardio-in" style="width:100%;margin-bottom:10px" placeholder="Custom exercise name (if 'Type my own')">
      <div style="display:flex;gap:8px">
        <button class="btn primary" style="margin:0" onclick="addExtra('${dISO}')">Add</button>
        <button class="btn" style="margin:0" onclick="toggleAddx()">Cancel</button>
      </div></div>`;
  } else {
    h += `<button class="addset" style="margin-bottom:10px" onclick="toggleAddx()">+ Add exercise</button>`;
  }
  // finish
  const finished = DB[dISO] && DB[dISO].__day && DB[dISO].__day.finished;
  h += `<button class="btn primary" style="margin-top:4px" onclick="finishWorkout('${dISO}')">${finished?"View workout summary 📸":"🏁 Finish workout → summary"}</button>`;
  return h;
}

// ---------- day summary ----------
function renderSummary(){
  const dISO = iso(viewDate);
  const dayName = DAYS[(viewDate.getDay()+6)%7];
  const wkN = Math.min(Math.max(weekOf(viewDate),1),25);
  const t = dayPlan(wkN, dayName);
  const wi = weekInfo(wkN);
  const day = DB[dISO] || {};
  const daysLeft = Math.round((RACE - viewDate)/864e5);
  let rows = "";
  let setCount = 0;
  let miles = 0;
  // the run goes FIRST - it's the headline of the day, not an afterthought
  const _r = day.__run;
  if(_r && (String(_r.dist).trim() || String(_r.time).trim())){
    miles = parseFloat(_r.dist)||0;
    const _pace = paceOf(_r.dist, _r.time);
    const _main = [];
    if(_r.dist) _main.push(_r.dist+" mi");
    if(_r.time) _main.push(_r.time);
    if(_pace)   _main.push(_pace+"/mi");
    if(_r.hr)   _main.push(_r.hr+" bpm");
    const _det = [];
    if(_r.cad)  _det.push(_r.cad+" spm");
    if(_r.cond) _det.push(_r.cond);
    if(_r.reps) _det.push(_r.reps);
    if(_r.splits) _det.push(_r.splits);
    if(_r.tempoMi||_r.tempoPace) _det.push((_r.tempoMi||"?")+" mi @ "+(_r.tempoPace||"?"));
    if(_r.half1||_r.half2) _det.push((_r.half1||"?")+" / "+(_r.half2||"?"));
    rows += `<div class="sum-row"><div class="sum-ex">\u{1F3C3} ${_r.type||"Easy"} Run</div>`
          + `<div class="sum-sets">${_main.join(" \u00b7 ")}</div>`
          + (_det.length?`<div class="sum-sets">${_det.join(" \u00b7 ")}</div>`:"")
          + (_r.note?`<div class="sum-note">"${_r.note}"</div>`:"")
          + `</div>`;
  }
  Object.keys(day).filter(k=>!k.startsWith("__")).forEach(ex=>{
    const e = day[ex];
    if(e.cardio && e.cardio.done){
      rows += `<div class="sum-row"><div class="sum-ex">${ex}</div><div class="sum-sets">${[e.cardio.dur,e.cardio.split].filter(Boolean).join(" · ")||"done ✓"}</div>${e.note?`<div class="sum-note">"${e.note}"</div>`:""}</div>`;
      return;
    }
    const sets = (e.sets||[]).filter(s=>s.done);
    if(!sets.length) return;
    setCount += sets.length;
    const best = Math.max(...sets.map(s=>parseFloat(s.w)||0));
    const prev = lastPerf(ex, dISO);
    const prevBest = prev ? Math.max(...prev.sets.map(s=>parseFloat(s.w)||0)) : null;
    const arrow = prevBest===null ? "" : (best>prevBest ? ' <span class="trend-up">▲</span>' : (best===prevBest ? "" : ' <span style="color:var(--red)">▼</span>'));
    rows += `<div class="sum-row"><div class="sum-ex">${ex}${arrow}</div><div class="sum-sets">${fmtSets(sets)}</div>${e.note?`<div class="sum-note">"${e.note}"</div>`:""}</div>`;
  });
  const checks = (day.__fuel && day.__fuel.checks) || {};
  const nChecked = Object.values(checks).filter(Boolean).length;
  const f = fuelFor(viewDate);
  let h = `<div class="sum-card">
    <div class="sum-head">
      <div class="sum-title">TOKYO27 TRAINING LOG</div>
      <div class="sum-date">${dayName}, ${viewDate.toLocaleDateString("en-US",{month:"short",day:"numeric"})} · Week ${wkN} — ${wi?wi.phase:""}</div>
      <div class="sum-session">${t.label}</div>
    </div>
    ${rows || '<div class="empty" style="padding:16px">Nothing logged yet for this day.</div>'}
    <div class="sum-foot">
      <span>${setCount} sets${miles?" \u00b7 "+miles+" mi":""}</span><span>🍽️ ${nChecked} fuel checks · ${f.cal.toLocaleString()} cal target</span><span>${daysLeft>0?daysLeft+"d to Tokyo":"🎉"}</span>
    </div>
  </div>
  <button class="btn primary" onclick="shareSummary()">📤 Share</button>
  <button class="btn" onclick="go('today')">← Back to Today</button>`;
  return h;
}

function exCard(it, dISO, adj){
  const log = (DB[dISO]&&DB[dISO][it.ex]) || null;
  const isLower = it.grp==="Lower Body";
  const isUpper = ["Upper Body","Back","Shoulders"].includes(it.grp);
  let targetSets = it.sets;
  if(targetSets && adj){
    if(isLower && adj.lower===-1) targetSets = Math.max(1,targetSets-1);
    if(isUpper && adj.upper===-1) targetSets = Math.max(1,targetSets-1);
  }
  const last = lastPerf(it.ex, dISO);
  const eid = btoa(unescape(encodeURIComponent(it.ex))).replace(/=/g,"");
  let h = `<div class="card" id="card-${eid}">
    <div class="ex-head"><div>
      <span class="ex-name">${it.ex}</span>${it.grp?`<span class="chip">${it.grp}</span>`:""}
      <div class="target">${targetSets?`Target: ${targetSets} × ${it.reps||"?"}`:(it.reps?`Target: ${it.reps}`:"")}${it.rest?` <span class="rest-hint">rest ${it.rest}s</span>`:""}</div>
      ${cueFor(it)?`<div class="desc">💡 ${cueFor(it)}</div>`:""}
      ${it.desc?`<div class="desc">${it.desc}</div>`:""}${it.notes?`<div class="desc">📌 ${it.notes}</div>`:""}
      ${ytFor(it)?`<a class="howto" href="${ytFor(it)}" target="_blank" rel="noopener">▶ Watch how-to</a>`:""}
    </div>${it.extraIdx!==undefined?`<button class="done-btn" style="flex-shrink:0" onclick="removeExtra('${dISO}',${it.extraIdx})">✕</button>`:""}</div>`;
  if(isCardio(it.ex)){
    const lc = lastCardio(it.ex, dISO);
    h += lc ? `<div class="last">Last time (${lc.date.slice(5).replace("-","/")}): ${[lc.dur,lc.split].filter(Boolean).join(" · ")}${lc.note?` — "${lc.note}"`:""}</div>`
            : `<div class="last none">First time logging this — set your baseline.</div>`;
    const c = (log && log.cardio) || {dur:"",split:"",done:false};
    h += `<div class="sets">
      <div class="setrow">
        <input class="cardio-in" placeholder="time / duration (e.g. 10 min)" value="${c.dur||""}" oninput="setCardio('${dISO}','${eid}','dur',this.value)">
        <input class="cardio-in" placeholder="split / distance (e.g. 2:20/500m)" value="${c.split||""}" oninput="setCardio('${dISO}','${eid}','split',this.value)">
        <button class="done-btn ${c.done?"on":""}" onclick="toggleCardioDone('${dISO}','${eid}')">✓</button>
      </div></div>`;
  } else {
    h += last ? `<div class="last">Last time (${last.date.slice(5).replace("-","/")}): ${fmtSets(last.sets)}${last.note?` — "${last.note}"`:""}</div>${coachTip(it, last, targetSets)}`
              : `<div class="last none">First time logging this — set your baseline.</div>`;
    const nSets = Math.max(log ? log.sets.length : 0, targetSets||1);
    const mid = midReps(it.reps);
    const tUnit = isTimeBased(it.reps) ? "secs" : "reps";
    h += `<div class="sets">`;
    for(let i=0;i<nSets;i++){
      const s = log&&log.sets[i] ? log.sets[i] : {w:"", r:"", done:false};
      const resW = resolveW(log, last, i);
      const prefR = (s.r!=="" && s.r!==undefined && s.r!==null) ? s.r : ((last&&last.sets[i]&&last.sets[i].r) || mid || "");
      const prefRN = isNaN(parseInt(prefR)) ? "null" : parseInt(prefR);
      const prefWN = isNaN(parseFloat(resW)) ? "null" : parseFloat(resW);
      h += `<div class="setrow">
        <span class="setnum">${i+1}</span>
        <div class="stepper"><button onclick="bump('${dISO}','${eid}',${i},'w',-1,${prefWN},${prefWN})">−</button><input id="w-${eid}-${i}" inputmode="decimal" value="${resW}" placeholder="wt" oninput="setVal('${dISO}','${eid}',${i},'w',this.value,${prefWN})"><span class="unit">${unitFor(it.ex)}</span><button onclick="bump('${dISO}','${eid}',${i},'w',1,${prefWN},${prefWN})">+</button></div>
        <div class="stepper"><button onclick="bump('${dISO}','${eid}',${i},'r',-1,${prefRN},${prefWN})">−</button><input id="r-${eid}-${i}" inputmode="numeric" value="${prefR}" placeholder="${tUnit}" oninput="setVal('${dISO}','${eid}',${i},'r',this.value,${prefWN})"><span class="unit">${tUnit==="secs"?"s":""}</span><button onclick="bump('${dISO}','${eid}',${i},'r',1,${prefRN},${prefWN})">+</button></div>
        <button class="done-btn ${s.done?"on":""}" onclick="toggleDone('${dISO}','${eid}',${i},${it.rest||0},${prefRN},${prefWN})">✓</button>
      </div>`;
    }
    const stored = log ? log.sets.length : 0;
    h += `<div style="display:flex;gap:8px"><button class="addset" style="flex:1" onclick="addSet('${dISO}','${eid}')">+ add set</button>`;
    if(stored > 1) h += `<button class="addset" style="flex:0 0 auto;padding:0 14px" onclick="removeSet('${dISO}','${eid}')">− remove last</button>`;
    h += `</div></div>`;
  }
  h += `<textarea class="notes" rows="1" placeholder="Notes — felt easy? go up next time?" oninput="setNote('${dISO}','${eid}',this.value)">${log&&log.note?log.note:""}</textarea>`;
  h += `</div>`;
  return h;
}

// map eid back to exercise name
function eidOf(name){ return btoa(unescape(encodeURIComponent(name))).replace(/=/g,""); }
function exFromEid(eid, dISO){
  for(const T of allTemplates()){ for(const d of DAYS){ if(!T[d]) continue; for(const it of T[d].items){
    if(eidOf(it.ex)===eid) return it.ex; } } }
  if(dISO && DB[dISO] && DB[dISO].__extra){
    for(const x of DB[dISO].__extra){ if(eidOf(x.ex)===eid) return x.ex; }
  }
  // fallback: scan all extras
  for(const d of Object.keys(DB)){ if(DB[d].__extra){ for(const x of DB[d].__extra){ if(eidOf(x.ex)===eid) return x.ex; } } }
  return null;
}
function ensure(dISO, ex, i, seedW){
  if(!DB[dISO]) DB[dISO]={};
  if(!DB[dISO][ex]) DB[dISO][ex]={sets:[],note:""};
  const nz = v => (v !== "" && v !== null && v !== undefined && !isNaN(parseFloat(v)));
  while(i!==undefined && DB[dISO][ex].sets.length<=i){
    const prev = DB[dISO][ex].sets[DB[dISO][ex].sets.length-1];
    // seed a newly-materialised set from the previous set, else from the resolved prefill, so
    // touching REPS can never blank the weight the user was already looking at
    let w = (prev && nz(prev.w)) ? prev.w : (nz(seedW) ? seedW : "");
    DB[dISO][ex].sets.push({w:w, r:"", done:false});
  }
  return DB[dISO][ex];
}
function removeSet(dISO,eid){
  const ex=exFromEid(eid,dISO); const l=DB[dISO]&&DB[dISO][ex];
  if(!l || !l.sets.length) return;
  l.sets.pop(); saveDB(DB); render();
}

let _bumpGuard = {k:"", t:0};
function bump(dISO,eid,i,f,dir,pref,seedW){
  // iOS fires a synthesised click after touchend; a full re-render between the two used to make one
  // tap register twice (70 -> 80). We now update the field in place instead of re-rendering, and
  // ignore an identical repeat inside 150 ms as a backstop.
  const key = dISO+"|"+eid+"|"+i+"|"+f+"|"+dir;
  const now = Date.now();
  if(_bumpGuard.k === key && now - _bumpGuard.t < 150) return;
  _bumpGuard = {k:key, t:now};
  const ex=exFromEid(eid,dISO); const l=ensure(dISO,ex,i,seedW); const s=l.sets[i];
  if(f==="w"){
    let base=parseFloat(s.w);
    if(isNaN(base)) base=(pref!==null&&pref!==undefined&&!isNaN(parseFloat(pref))) ? parseFloat(pref) : NaN;
    // NEVER invent a zero: minus on a genuinely blank field is a no-op, plus seeds at 5
    if(isNaN(base)){ if(dir<0) return; base = 0; }
    s.w=Math.max(0, base + dir*5);
  }
  else{
    let n=parseInt(s.r);
    if(isNaN(n)) n=(pref!==null&&pref!==undefined) ? parseInt(pref)+dir : Math.max(0,dir);
    else n=n+dir;
    s.r=Math.max(0,n);

  if(el) el.value = (f==="w") ? s.w : s.r;

}

function runTypeFor(label){

  if(/x\s*\d{3}|repeat|interval|800s|400s/.test(L)) return "Intervals";
  if(/tempo|marathon effort|threshold/.test(L)) return "Tempo";
  if(/shakeout/.test(L)) return "Shakeout";

}
function labelFor(dISO){

  return t ? t.label : "";
}
function ensureRun(dISO, label){
  // The label used to be passed in via an inline handler attribute; JSON.stringify put
  // double quotes inside a double-quoted attribute and every handler was a syntax error -
  // the run card never saved anything from the day it shipped. Derive it here instead.
  if(label===undefined || label===null) label = labelFor(dISO);
  if(!DB[dISO]) DB[dISO]={};
  if(!DB[dISO].__run) DB[dISO].__run={type:runTypeFor(label),dist:"",time:"",hr:"",cad:"",cond:"",feel:"",

function setRun(dISO,f,v,label){ ensureRun(dISO,label)[f]=v; saveDB(DB); }

function clearRun(dISO){ if(DB[dISO]) delete DB[dISO].__run; saveDB(DB); render(); }
function secsOf(t){
  const p = String(t||"").trim().split(":").map(x=>parseFloat(x));
  if(!p.length || p.some(isNaN)) return null;
  if(p.length===3) return p[0]*3600+p[1]*60+p[2];
  if(p.length===2) return p[0]*60+p[1];
  if(p.length===1) return p[0]*60;           // bare number = minutes
  return null;
}
function mmss(sec){
  if(sec==null||!isFinite(sec)) return "";

}
function paceOf(dist,time){
  const d=parseFloat(dist), sec=secsOf(time);
  if(!d || d<=0 || sec==null || sec<=0) return "";
  return mmss(sec/d);
}

function rowsForDay(dISO){
  const d = parseISO(dISO);
  const dayName = DAYS[(d.getDay()+6)%7];
  const wkN = Math.min(Math.max(weekOf(d),1),25);
  const t = dayPlan(wkN, dayName);
  const grpOf = {};
  t.items.forEach(it=>{ grpOf[it.ex] = it.grp||""; });
  const day = DB[dISO] || {};
  const rows = [];
  const r = day.__run;
  if(r && (String(r.dist).trim() || String(r.time).trim())){
    // columns are reused: weight=miles, reps=avg HR, duration=total time, split=pace/mi
    const bits = [];
    if(r.cad)  bits.push("cadence: "+r.cad+" spm");
    if(r.cond) bits.push("conditions: "+r.cond);
    if(r.reps) bits.push("reps: "+r.reps);
    if(r.splits) bits.push("splits: "+r.splits);
    if(r.tempoMi||r.tempoPace) bits.push("tempo: "+(r.tempoMi||"?")+" mi @ "+(r.tempoPace||"?"));
    if(r.half1||r.half2) bits.push("halves: "+(r.half1||"?")+" / "+(r.half2||"?"));
    if(r.note) bits.push(r.note);
    rows.push({date:dISO, day:dayName, week:wkN, session:t.label,
      exercise:"Run - "+(r.type||"Easy"), group:"Running", set:1,
      weight:r.dist||"", reps:r.hr||"", duration:r.time||"",
      split:paceOf(r.dist,r.time), note:bits.join(" | ")});
  }
  Object.keys(day).filter(k=>!k.startsWith("__")).forEach(ex=>{
    const e = day[ex];
    if(e.cardio && e.cardio.done){
      rows.push({date:dISO, day:dayName, week:wkN, session:t.label, exercise:ex,
        group:grpOf[ex]||"Cross-training", set:1, weight:"", reps:"",
        duration:e.cardio.dur||"", split:e.cardio.split||"", note:e.note||""});
      return;
    }
    (e.sets||[]).forEach((s,i)=>{
      if(!s.done) return;
      rows.push({date:dISO, day:dayName, week:wkN, session:t.label, exercise:ex,
        group:grpOf[ex]||"", set:i+1, weight:(s.w===""||s.w==null)?"":s.w,
        reps:(s.r===""||s.r==null)?"":s.r, duration:"", split:"",
        note:(i===0 ? (e.note||"") : "")});
    });
  });
  return rows;
}
function postRows(rows, lastDay){
  try{
    fetch(syncCfg.url, {method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({rows})});
    syncCfg.last = new Date().toISOString(); syncCfg.lastDay = lastDay || ""; saveSync();
    return true;
  }catch(err){ return false; }
}
function syncDay(dISO, quiet){

  if(!quiet) alertMsg(ok ? "Sent to your sheet ✓" : "Sync failed — check the URL");
  return ok;
}
// One request for the whole history. Sending a request per day let them race

function syncAll(){

  const days = Object.keys(DB).sort();
  let rows = [];
  days.forEach(d=>{ rows = rows.concat(rowsForDay(d)); });

// ---------- rest timer (wall-clock anchored: survives tab/app switches) ----------
const Timer = {
  endAt:0, iv:null,
  start(sec){ this.endAt = Date.now() + sec*1000;
    document.getElementById("timer").classList.add("show"); this.tick();
    clearInterval(this.iv); this.iv=setInterval(()=>this.tick(),500); },
  add(s){ this.endAt += s*1000; this.tick(); },
  left(){ return Math.round((this.endAt - Date.now())/1000); },
  tick(){ const l=this.left();
    if(l<=0){ this.stop(); if(navigator.vibrate) navigator.vibrate([200,100,200]); return; }
    const m=Math.floor(l/60), s=l%60;
    document.getElementById("timer-t").textContent = m+":"+String(s).padStart(2,"0"); },
  stop(){ clearInterval(this.iv); document.getElementById("timer").classList.remove("show"); }
};
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && Timer.endAt > 0 && Timer.left() > 0) Timer.tick(); });

// ---------- fuel ----------
function lrDayFor(wkN){
  return (PLAN.fuel.lrDays && PLAN.fuel.lrDays[String(wkN)]) || "Saturday";
}
function bwLb(){
  const v = parseFloat(localStorage.getItem(KEY+"-bw"));
  return (v>0 ? v : (PLAN.fuel.bwLb || 150));
}
function setBw(v){
  const n = parseFloat(v);
  if(n>0) localStorage.setItem(KEY+"-bw", String(n));
  const f = fuelFor(viewDate);
  const c = document.getElementById("fcal"), p = document.getElementById("fpro");
  if(c) c.textContent = f.cal.toLocaleString();
  if(p) p.textContent = proteinTarget()+"g";
}
function proteinTarget(){ return Math.round(bwLb() * (PLAN.fuel.proteinPerLb || 1)); }
function r10(n){ return Math.round(n/10)*10; }
// Calorie targets scale with bodyweight. A day with a "k" key uses kcalPerLb[k];
// a day with an explicit "cal" is scaled from the plan's reference bodyweight.
function calFor(base){
  const bw = bwLb(), F = PLAN.fuel, M = F.kcalPerLb || {};
  if(base.k && M[base.k]) return r10(bw * M[base.k]);
  if(base.cal) return r10(base.cal * (bw / (F.bwLb || 150)));
  return r10(bw * (M.rest || 15.3));
}
function fuelFor(d){
  const dayName = DAYS[(d.getDay()+6)%7];
  const wkN = Math.min(Math.max(weekOf(d),1),25);
  const wd = PLAN.fuel.weekDays && PLAN.fuel.weekDays[String(weekOf(d))];
  const legacy = (weekOf(d)===1 && PLAN.fuel.week1Days) ? PLAN.fuel.week1Days[dayName] : null;
  const base = (wd && wd[dayName]) || legacy || PLAN.fuel.days[dayName];
  let cal = calFor(base);
  if(dayName === lrDayFor(wkN)){
    const mi = PLAN.fuel.lrMiles[wkN-1] || 0;
    const bw = bwLb(), M = PLAN.fuel.kcalPerLb || {};
    cal = r10(bw*(M.rest||15.3) + bw*(PLAN.fuel.longPerMilePerLb||0.4)*mi);
    return {...base, cal, mi, wkN};
  }
  return {...base, cal, wkN};
}
// day "kind" drives the checklist: lift | hard | long | rest
function kindFor(dayName, f, wkN){
  if(f && f.kind) return f.kind;
  if(dayName === lrDayFor(wkN)) return "long";
  if(["Tuesday","Thursday"].includes(dayName)) return "hard";
  if(["Monday","Wednesday","Friday"].includes(dayName)) return "lift";
  return "rest";
}
function checklistFor(dayName, f, wkN){
  const c = PLAN.fuel.checklist;
  const kind = kindFor(dayName, f, wkN);
  let items = [...c.common];
  if(kind==="lift" || kind==="hard") items = items.concat(c.lift);
  if(kind==="hard") items = items.concat(c.hard);
  if(kind==="long") items = items.concat(c.long);
  if(kind==="rest") items = items.concat(c.rest);
  return items;
}
