<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1420">
<title>NYC26 — Adam's Training Log</title>
<style>
:root{
  --bg:#0f1420; --card:#1a2232; --card2:#212c42; --line:#2c3a55;
  --txt:#e8edf7; --dim:#8b98b3; --accent:#4f8ef7; --green:#3ecf8e;
  --orange:#f5a623; --red:#ef6461;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:84px}
header{padding:18px 16px 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:5}
h1{font-size:18px;font-weight:800;letter-spacing:.3px}
.sub{color:var(--dim);font-size:12px;margin-top:3px}
.countdown{color:var(--orange);font-weight:700}
.phase-band{margin:10px 16px 0;padding:9px 12px;border-radius:10px;font-size:12.5px;line-height:1.45;background:var(--card2);border:1px solid var(--line);color:var(--dim)}
.phase-band b{color:var(--txt)}
main{padding:8px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.session-label{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin:14px 4px 8px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-name{font-size:15.5px;font-weight:700}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--dim);margin-left:6px;vertical-align:middle}
.target{color:var(--dim);font-size:12.5px;margin-top:3px}
.desc{color:var(--dim);font-size:12px;margin-top:5px;font-style:italic;line-height:1.4}
.howto{display:inline-block;margin-top:7px;font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;background:var(--card2);border:1px solid var(--line);padding:5px 10px;border-radius:8px}
.last{margin-top:7px;font-size:12.5px;color:var(--green)}
.last.none{color:var(--dim)}
.sets{margin-top:10px}
.setrow{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.setnum{width:20px;color:var(--dim);font-size:12px;font-weight:700}
.stepper{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:38px;height:40px;background:none;border:none;color:var(--accent);font-size:20px;font-weight:700}
.stepper input{width:52px;height:40px;background:none;border:none;color:var(--txt);font-size:15px;font-weight:700;text-align:center;outline:none}
.stepper .unit{color:var(--dim);font-size:10px;padding-right:8px}
.done-btn{margin-left:auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--dim);font-size:17px}
.done-btn.on{background:var(--green);border-color:var(--green);color:#08281a}
.addset{background:none;border:1px dashed var(--line);color:var(--dim);border-radius:10px;padding:8px;width:100%;font-size:12.5px;margin-top:2px}
.notes{width:100%;margin-top:9px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:9px;font-size:13px;font-family:inherit;resize:none}
.notes::placeholder{color:#5b6880}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(15,20,32,.97);border-top:1px solid var(--line);backdrop-filter:blur(8px);z-index:10}
nav button{flex:1;background:none;border:none;color:var(--dim);padding:11px 0 max(11px, env(safe-area-inset-bottom));font-size:10.5px;font-weight:600}
nav button .ic{display:block;font-size:19px;margin-bottom:2px}
nav button.on{color:var(--accent)}
.timer{position:fixed;bottom:76px;left:12px;right:12px;background:var(--accent);color:#fff;border-radius:14px;padding:12px 16px;display:none;align-items:center;justify-content:space-between;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.timer.show{display:flex}
.timer .t{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.timer button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;padding:7px 13px;font-weight:700;font-size:13px}
.daynav{display:flex;gap:5px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.daynav::-webkit-scrollbar{display:none}
.daybtn{flex:0 0 auto;min-width:46px;padding:7px 6px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:11px;text-align:center;font-weight:600}
.daybtn .dd{font-size:14px;color:var(--txt);font-weight:800;display:block}
.daybtn.on{border-color:var(--accent);background:#1b2b4d;color:var(--accent)}
.daybtn.on .dd{color:var(--accent)}
.wk-row{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);font-size:13px;gap:8px}
.wk-row:last-child{border:none}
.wk-row .l{color:var(--dim);flex-shrink:0}
.wk-row .r{text-align:right;line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--dim);font-weight:600;padding:7px 6px;border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
td{padding:8px 6px;border-bottom:1px solid #1e2941;vertical-align:top;line-height:1.4}
tr.cur td{background:#1b2b4d}
.ph-Build{color:var(--green)} .ph-Peak{color:var(--orange)} .ph-Taper{color:var(--accent)} .ph-RACE{color:var(--red);font-weight:700}
select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);padding:12px;border-radius:12px;font-size:15px;margin-bottom:10px}
.hist-sess{border-bottom:1px solid var(--line);padding:10px 2px}
.hist-sess:last-child{border:none}
.hist-date{font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
.hist-sets{font-size:14.5px;font-weight:700;margin-top:3px}
.hist-note{font-size:12px;color:var(--orange);margin-top:3px;font-style:italic}
.trend-up{color:var(--green)} .trend-flat{color:var(--dim)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:14px;font-weight:600;margin-bottom:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.warn{background:#3a2b18;border:1px solid #6b4a1c;color:var(--orange);border-radius:12px;padding:11px;font-size:12.5px;line-height:1.5;margin-bottom:10px}
.io{width:100%;height:120px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:11px;padding:8px;font-family:monospace;margin-bottom:8px}
.rest-hint{font-size:11px;color:var(--dim);margin-left:4px}
h2{font-size:15px;margin:6px 4px 10px}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:30px 10px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>NYC26 TRAINING LOG</h1>
  <div class="sub" id="subhead"></div>
</header>
<div class="phase-band" id="phaseband"></div>
<main id="main"></main>

<div class="timer" id="timer">
  <div><div style="font-size:10px;font-weight:700;opacity:.8">REST</div><div class="t" id="timer-t">1:00</div></div>
  <div style="display:flex;gap:8px">
    <button onclick="Timer.add(30)">+30s</button>
    <button onclick="Timer.stop()">Done</button>
  </div>
</div>

<nav>
  <button id="nav-today" class="on" onclick="go('today')"><span class="ic">🏋️</span>Today</button>
  <button id="nav-fuel" onclick="go('fuel')"><span class="ic">🍽️</span>Fuel</button>
  <button id="nav-week" onclick="go('week')"><span class="ic">📅</span>Week</button>
  <button id="nav-history" onclick="go('history')"><span class="ic">📈</span>History</button>
  <button id="nav-plan" onclick="go('plan')"><span class="ic">🗺️</span>Plan</button>
  <button id="nav-data" onclick="go('data')"><span class="ic">💾</span>Data</button>
</nav>

// ---------- storage (localStorage with in-memory fallback) ----------
let mem = {}, canStore = false;
try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); canStore = true; } catch(e) {}
function loadDB(){ if(canStore){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } } return mem; }
function saveDB(db){ if(canStore){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} } mem = db; }
let DB = loadDB();   // { "YYYY-MM-DD": { "Exercise Name": {sets:[{w,r,done}], note:""} } }

// ---------- date helpers ----------
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); }
const WEEK1 = parseISO(PLAN.week1), RACE = parseISO(PLAN.race);
function weekOf(d){ return Math.floor((d - WEEK1)/(7*864e5)) + 1; }
function mondayOfWeek(n){ const d = new Date(WEEK1); d.setDate(d.getDate()+(n-1)*7); return d; }
let viewDate = new Date(); viewDate.setHours(0,0,0,0);
let tab = "today", histEx = null;

// ---------- phase logic ----------
function weekInfo(n){ return PLAN.weeks.find(w=>w.wk===n) || null; }
function tmpl(n){ return n===1 ? PLAN.override : PLAN.template; }
function allTemplates(){ return [PLAN.template, PLAN.override]; }
function phaseAdjust(n){
  const wi = weekInfo(n); if(!wi) return null;
  if(wi.phase.startsWith("Peak")) return {lower:-1, note:"PEAK: drop 1 set from every lower-body lift. Same weights — you're maintaining, the running is the point now."};
  if(wi.phase.includes("down")||wi.phase==="Build (down)") return {lower:-1, upper:-1, note:"DOWN WEEK: −1 set on everything, same weights. Recovery is training."};
  if(wi.phase==="Taper") return {lower:-99, note:"TAPER: follow the strength notes on the Plan tab — lower body is winding down."};
  if(wi.phase==="RACE WEEK") return {lower:-99, upper:-99, note:"RACE WEEK. Bodyweight circuit Monday only. Nothing after Tuesday. Trust the taper."};
  return null;
}

  const daysLeft = Math.round((RACE-today)/864e5);
  document.getElementById("subhead").innerHTML =
    (wkN>=1&&wkN<=14 ? `Week ${wkN} of 14 · ` : "") + `<span class="countdown">${daysLeft>0?daysLeft+" days to NYC":(daysLeft===0?"RACE DAY 🎉":"Race complete")}</span>`;
  const wi = weekInfo(Math.min(Math.max(weekOf(viewDate),1),14));
  const pb = document.getElementById("phaseband");
  if(wi && tab!=="data" && tab!=="history"){
    pb.style.display="block";
    pb.innerHTML = `<b>Week ${wi.wk} — ${wi.phase}</b><br>${wi.strength}`;
  } else pb.style.display="none";
  const m = document.getElementById("main");
  if(tab==="today") m.innerHTML = renderToday();
  else if(tab==="fuel") m.innerHTML = renderFuel();
  else if(tab==="week") m.innerHTML = renderWeek();
  else if(tab==="history"){ m.innerHTML = renderHistory(); const s=document.getElementById("histsel"); if(s) s.value = histEx||""; }
  else if(tab==="plan") m.innerHTML = renderPlan();
  else m.innerHTML = renderData();
}

function dayNav(){
  const start = new Date(viewDate); start.setDate(start.getDate()-3);
  let h = '<div class="daynav">';
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(d.getDate()+i);
    const on = iso(d)===iso(viewDate);
    h += `<button class="daybtn ${on?"on":""}" onclick="setDate('${iso(d)}')">${DAYS[(d.getDay()+6)%7].slice(0,3)}<span class="dd">${d.getDate()}</span></button>`;
  }
  return h+"</div>";
}
function setDate(s){ viewDate = parseISO(s); render(); }

function lastPerf(ex, beforeISO){
  const dates = Object.keys(DB).filter(d=>d<beforeISO && DB[d][ex] && DB[d][ex].sets && DB[d][ex].sets.some(s=>s.done)).sort();
  if(!dates.length) return null;
  const d = dates[dates.length-1], sets = DB[d][ex].sets.filter(s=>s.done);
  return {date:d, sets, note:DB[d][ex].note||""};
}
function fmtSets(sets){ return sets.map(s=>`${s.w||"BW"}×${s.r}`).join(", "); }

function renderToday(){
  const dISO = iso(viewDate);
  const dayName = DAYS[(viewDate.getDay()+6)%7];
  const wkN = weekOf(viewDate);
  const t = tmpl(wkN)[dayName];
  const adj = (wkN>=1&&wkN<=14) ? phaseAdjust(wkN) : null;
  let h = dayNav();
  const f = fuelFor(viewDate);
  h += `<div class="card" style="padding:10px 14px;cursor:pointer" onclick="go('fuel')">
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px">
      <span>🍽️ <b>${f.cal.toLocaleString()} cal</b> · ${PLAN.fuel.protein}g protein</span>
      <span style="color:var(--dim);font-size:11.5px">${f.carb} →</span>
    </div></div>`;
  h += `<div class="session-label">${dayName} — ${t.label}</div>`;
  if(adj) h += `<div class="warn">${adj.note}</div>`;
  if(wkN<1||wkN>14) h += `<div class="warn">This date is outside the 14-week plan (Jul 27 – Nov 1). Showing the standard template.</div>`;
  t.items.forEach(it=>{
    if(!it.grp && it.ex==="Full Rest Day"){
      h += `<div class="card"><div class="ex-name">😴 ${wkN===1&&dayName==="Monday"?"Recovery Day":"Full Rest Day"}</div><div class="desc">${it.desc}</div></div>`; return;
    }
    h += exCard(it, dISO, adj);
  });
  return h;
}

function exCard(it, dISO, adj){
  const log = (DB[dISO]&&DB[dISO][it.ex]) || null;
  const isLower = it.grp==="Lower Body";
  const isUpper = ["Upper Body","Back","Shoulders"].includes(it.grp);
  let targetSets = it.sets;
  if(targetSets && adj){
    if(isLower && adj.lower===-1) targetSets = Math.max(1,targetSets-1);
    if(isUpper && adj.upper===-1) targetSets = Math.max(1,targetSets-1);
  }
  const last = lastPerf(it.ex, dISO);
  const eid = btoa(unescape(encodeURIComponent(it.ex))).replace(/=/g,"");
  let h = `<div class="card" id="card-${eid}">
    <div class="ex-head"><div>
      <span class="ex-name">${it.ex}</span>${it.grp?`<span class="chip">${it.grp}</span>`:""}
      <div class="target">${targetSets?`Target: ${targetSets} × ${it.reps||"?"}`:(it.reps?`Target: ${it.reps}`:"")}${it.rest?` <span class="rest-hint">rest ${it.rest}s</span>`:""}</div>
      ${it.cue?`<div class="desc">💡 ${it.cue}</div>`:""}
      ${it.desc?`<div class="desc">${it.desc}</div>`:""}${it.notes?`<div class="desc">📌 ${it.notes}</div>`:""}
      ${it.yt?`<a class="howto" href="${it.yt}" target="_blank" rel="noopener">▶ Watch how-to</a>`:""}
    </div></div>`;
  h += last ? `<div class="last">Last time (${last.date.slice(5).replace("-","/")}): ${fmtSets(last.sets)}${last.note?` — "${last.note}"`:""}</div>`
            : `<div class="last none">First time logging this — set your baseline.</div>`;
  const nSets = log ? log.sets.length : (targetSets||1);
  h += `<div class="sets">`;
  for(let i=0;i<nSets;i++){
    const s = log&&log.sets[i] ? log.sets[i] : {w:(last&&last.sets[i]?last.sets[i].w:(last&&last.sets[0]?last.sets[0].w:"")), r:"", done:false};
    h += `<div class="setrow">
      <span class="setnum">${i+1}</span>
      <div class="stepper"><button onclick="bump('${dISO}','${eid}',${i},'w',-1)">−</button><input inputmode="decimal" value="${s.w!==undefined?s.w:""}" placeholder="wt" onchange="setVal('${dISO}','${eid}',${i},'w',this.value)"><span class="unit">lb</span><button onclick="bump('${dISO}','${eid}',${i},'w',1)">+</button></div>
      <div class="stepper"><button onclick="bump('${dISO}','${eid}',${i},'r',-1)">−</button><input inputmode="numeric" value="${s.r||""}" placeholder="reps" onchange="setVal('${dISO}','${eid}',${i},'r',this.value)"><button onclick="bump('${dISO}','${eid}',${i},'r',1)">+</button></div>
      <button class="done-btn ${s.done?"on":""}" onclick="toggleDone('${dISO}','${eid}',${i},${it.rest||0})">✓</button>
    </div>`;
  }
  h += `<button class="addset" onclick="addSet('${dISO}','${eid}')">+ add set</button></div>`;
  h += `<textarea class="notes" rows="1" placeholder="Notes — felt easy? go up next time?" onchange="setNote('${dISO}','${eid}',this.value)">${log&&log.note?log.note:""}</textarea>`;
  h += `</div>`;
  return h;
}

// map eid back to exercise name
function exFromEid(eid){
  for(const T of allTemplates()){ for(const d of DAYS){ for(const it of T[d].items){
    if(btoa(unescape(encodeURIComponent(it.ex))).replace(/=/g,"")===eid) return it.ex; } } }
  return null;
}
function ensure(dISO, ex, i){
  if(!DB[dISO]) DB[dISO]={};
  if(!DB[dISO][ex]) DB[dISO][ex]={sets:[],note:""};
  while(i!==undefined && DB[dISO][ex].sets.length<=i){
    const prev = DB[dISO][ex].sets[DB[dISO][ex].sets.length-1];
    DB[dISO][ex].sets.push({w:prev?prev.w:"", r:"", done:false});
  }
  return DB[dISO][ex];
}
function setVal(dISO,eid,i,f,v){ const ex=exFromEid(eid); ensure(dISO,ex,i).sets[i][f]=v; saveDB(DB); }
function bump(dISO,eid,i,f,dir){
  const ex=exFromEid(eid); const l=ensure(dISO,ex,i); const s=l.sets[i];
  if(f==="w"){ let n=parseFloat(s.w); if(isNaN(n)) n=0; n=Math.max(0,n+dir*5); s.w=n; }
  else{ let n=parseInt(s.r); if(isNaN(n)) n=0; n=Math.max(0,n+dir); s.r=n; }
  saveDB(DB); render();
}
function toggleDone(dISO,eid,i,rest){
  const ex=exFromEid(eid); const l=ensure(dISO,ex,i); const s=l.sets[i];
  if(!s.r && !s.done && lastTargetReps(ex)) s.r = lastTargetReps(ex);
  s.done=!s.done; saveDB(DB); render();
  if(s.done && rest) Timer.start(rest);
}
function lastTargetReps(ex){
  for(const T of allTemplates()){ for(const d of DAYS){ for(const it of T[d].items){ if(it.ex===ex && it.reps){ const m=String(it.reps).match(/^(\d+)/); return m?parseInt(m[1]):null; } } } }
  return null;
}
function addSet(dISO,eid){ const ex=exFromEid(eid); const l=ensure(dISO,ex); const prev=l.sets[l.sets.length-1];
  l.sets.push({w:prev?prev.w:"",r:"",done:false}); saveDB(DB); render(); }
function setNote(dISO,eid,v){ const ex=exFromEid(eid); ensure(dISO,ex).note=v; saveDB(DB); }

// ---------- rest timer ----------
const Timer = {
  left:0, iv:null,
  start(sec){ this.left=sec; document.getElementById("timer").classList.add("show"); this.tick();
    clearInterval(this.iv); this.iv=setInterval(()=>{ this.left--; this.tick();
      if(this.left<=0){ this.stop(); if(navigator.vibrate) navigator.vibrate([200,100,200]); } },1000); },
  add(s){ this.left+=s; this.tick(); },
  tick(){ const m=Math.floor(Math.max(0,this.left)/60), s=Math.max(0,this.left)%60;
    document.getElementById("timer-t").textContent = m+":"+String(s).padStart(2,"0"); },
  stop(){ clearInterval(this.iv); document.getElementById("timer").classList.remove("show"); }
};

// ---------- fuel ----------
function fuelFor(d){
  const dayName = DAYS[(d.getDay()+6)%7];
  const wkN = Math.min(Math.max(weekOf(d),1),14);
  const base = PLAN.fuel.days[dayName];
  let cal = base.cal;
  if(dayName==="Saturday"){
    const mi = PLAN.fuel.lrMiles[wkN-1] || 0;
    cal = PLAN.fuel.satBase + PLAN.fuel.satPerMile*mi;
    return {...base, cal, mi, wkN};
  }
  return {...base, cal, wkN};
}
function checklistFor(dayName){
  const c = PLAN.fuel.checklist;
  let items = [...c.common];
  if(["Monday","Wednesday","Friday","Tuesday","Thursday"].includes(dayName)) items = items.concat(c.lift);
  if(["Tuesday","Thursday"].includes(dayName)) items = items.concat(c.hard);
  if(dayName==="Saturday") items = items.concat(c.long);
  if(dayName==="Sunday") items = items.concat(c.rest);
  return items;
}
function renderFuel(){
  const dISO = iso(viewDate);
  const dayName = DAYS[(viewDate.getDay()+6)%7];
  const f = fuelFor(viewDate);
  let h = dayNav();
  h += `<h2>${dayName} — ${f.type}</h2>`;
  if(f.wkN===14) h += `<div class="warn">${PLAN.fuel.raceWeek}</div>`;
  h += `<div class="card"><div style="display:flex;gap:18px;text-align:center;justify-content:space-around">
    <div><div style="font-size:26px;font-weight:800">${f.cal.toLocaleString()}</div><div style="font-size:11px;color:var(--dim)">CALORIES</div></div>
    <div><div style="font-size:26px;font-weight:800">${PLAN.fuel.protein}g</div><div style="font-size:11px;color:var(--dim)">PROTEIN</div></div>
    <div><div style="font-size:15px;font-weight:700;padding-top:7px">${f.carb}</div><div style="font-size:11px;color:var(--dim)">CARB FOCUS</div></div>
  </div>
  ${f.mi?`<div class="desc" style="margin-top:9px">Long run: ${f.mi} mi — that's why today runs hot. Eat it all.</div>`:""}
  <div class="desc" style="margin-top:7px">${f.note}</div></div>`;
  // checklist
  const checks = (DB[dISO] && DB[dISO].__fuel && DB[dISO].__fuel.checks) || {};
  h += `<div class="session-label">Today's checklist</div><div class="card">`;
  checklistFor(dayName).forEach((item,i)=>{
    const on = !!checks[i];
    h += `<div class="setrow" style="margin-bottom:9px" onclick="toggleFuel('${dISO}',${i})">
      <button class="done-btn ${on?"on":""}" style="margin-left:0;flex-shrink:0">✓</button>
      <span style="font-size:13px;line-height:1.4;${on?"color:var(--dim);text-decoration:line-through":""}">${item}</span></div>`;
  });
  h += `</div><div class="session-label">Food that gets you there</div>`;
  PLAN.fuel.foods.forEach(([cat,items])=>{
    h += `<div class="card"><div style="font-weight:700;font-size:13px;margin-bottom:6px">${cat}</div>`;
    items.forEach(x=>{ h += `<div style="font-size:12.5px;color:var(--dim);padding:3px 0;line-height:1.4">• ${x}</div>`; });
    h += `</div>`;
  });
  h += `<div class="card" style="font-size:12px;color:var(--dim);line-height:1.5">Maintenance targets — the mileage does the leaning. If weight drops more than ~1 lb/week or runs feel flat, eat 200 more. Weigh-ins: same time, 2x/week max.</div>`;
  return h;
}
function toggleFuel(dISO,i){
  if(!DB[dISO]) DB[dISO]={};
  if(!DB[dISO].__fuel) DB[dISO].__fuel={checks:{}};
  DB[dISO].__fuel.checks[i] = !DB[dISO].__fuel.checks[i];
  saveDB(DB); render();
}

// ---------- week view ----------
function renderWeek(){
  const wkN = Math.min(Math.max(weekOf(viewDate),1),14);
  const mon = mondayOfWeek(wkN);
  let h = `<h2>Week ${wkN} — sessions</h2>`;
  for(let i=0;i<7;i++){
    const d = new Date(mon); d.setDate(d.getDate()+i);
    const dISO = iso(d), dayName = DAYS[i], t = tmpl(wkN)[dayName];
    const logged = DB[dISO] ? Object.values(DB[dISO]).reduce((a,e)=>a+((e.sets||[]).filter(s=>s.done).length),0) : 0;
    h += `<div class="card" onclick="setDate('${dISO}');go('today')" style="cursor:pointer">
      <div class="ex-head"><div><span class="ex-name">${dayName} <span style="color:var(--dim);font-weight:400;font-size:12px">${d.getMonth()+1}/${d.getDate()}</span></span>
      <div class="target">${t.label}</div></div>
      <div style="font-size:12px;color:${logged?"var(--green)":"var(--dim)"};white-space:nowrap">${logged?logged+" sets ✓":"—"}</div></div></div>`;
  }
  return h;
}

// ---------- history ----------
function allExercises(){
  const s = new Set();
  allTemplates().forEach(T=>DAYS.forEach(d=>T[d].items.forEach(it=>{ if(it.grp && it.grp!=="Warm-up") s.add(it.ex); })));
  Object.values(DB).forEach(day=>Object.keys(day).forEach(e=>{ if(!e.startsWith("__")) s.add(e); }));
  return [...s].sort();
}
function renderHistory(){
  let h = `<h2>Exercise history</h2><select id="histsel" onchange="histEx=this.value;render()"><option value="">— pick an exercise —</option>`;
  allExercises().forEach(e=>h+=`<option ${e===histEx?"selected":""}>${e}</option>`);
  h += `</select>`;
  if(!histEx){ return h + `<div class="empty">Pick an exercise to see every session, your best sets, and whether you're trending up.<br><br>Log a few workouts first if this is day one. 💪</div>`; }
  const sessions = Object.keys(DB).filter(d=>DB[d][histEx]&&DB[d][histEx].sets.some(s=>s.done)).sort().reverse();
  if(!sessions.length) return h + `<div class="empty">No logged sessions for ${histEx} yet.</div>`;
  h += `<div class="card">`;
  let prevBest = null;
  const bests = sessions.map(d=>Math.max(...DB[d][histEx].sets.filter(s=>s.done).map(s=>parseFloat(s.w)||0)));
  sessions.forEach((d,i)=>{
    const sets = DB[d][histEx].sets.filter(s=>s.done);
    const best = bests[i], prev = bests[i+1];
    const trend = prev===undefined ? "" : (best>prev ? ` <span class="trend-up">▲</span>` : (best===prev?` <span class="trend-flat">—</span>`:` <span style="color:var(--red)">▼</span>`));
    h += `<div class="hist-sess"><div class="hist-date"><span>${d}</span><span>best ${best||"BW"}${trend}</span></div>
      <div class="hist-sets">${fmtSets(sets)}</div>
      ${DB[d][histEx].note?`<div class="hist-note">"${DB[d][histEx].note}"</div>`:""}</div>`;
  });
  return h+"</div>";
}

// ---------- plan ----------
function renderPlan(){
  const wkN = Math.min(Math.max(weekOf(new Date()),1),14);
  let h = `<h2>14 weeks to race day — Nov 1, 2026</h2><div class="card" style="padding:6px 10px"><table>
    <tr><th>Wk</th><th>Phase</th><th>Strength focus</th></tr>`;
  PLAN.weeks.forEach(w=>{
    const mon = mondayOfWeek(w.wk);
    const phCls = "ph-"+w.phase.split(" ")[0].replace("RACE","RACE");
    h += `<tr class="${w.wk===wkN?"cur":""}"><td><b>${w.wk}</b><br><span style="color:var(--dim);font-size:10px">${mon.getMonth()+1}/${mon.getDate()}</span></td>
      <td class="${phCls}">${w.phase}</td><td>${w.strength}</td></tr>`;
  });
  return h + `</table></div>`;
}

// ---------- data ----------
function renderData(){
  const n = Object.keys(DB).length;
  let h = `<h2>Your data</h2>`;
  if(!canStore) h += `<div class="warn"><b>Heads up:</b> this browser doesn't allow saved storage, so logs live only while this page is open. Export below before closing, and paste back in next time (or open this file from your phone's Files app / a real browser tab where saving works).</div>`;
  else h += `<div class="card" style="font-size:13px;color:var(--dim)">Logs are saved on this device automatically (${n} day${n===1?"":"s"} logged). Export a backup every week or two — phones clear browser storage sometimes.</div>`;
  h += `<button class="btn primary" onclick="doExport()">📤 Export backup (download JSON)</button>
    <button class="btn" onclick="doCopy()">📋 Copy backup to clipboard</button>
    <div style="margin:14px 4px 6px;font-size:12px;color:var(--dim)">Restore: paste a backup below</div>
    <textarea class="io" id="io" placeholder='{"2026-07-27": ...}'></textarea>
    <button class="btn" onclick="doImport()">📥 Import (merges with existing)</button>`;
  return h;
}
function doExport(){
  const blob = new Blob([JSON.stringify(DB,null,1)],{type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "nyc26-log-backup.json"; a.click();
}
function doCopy(){
  const t = JSON.stringify(DB);
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>alertMsg("Copied ✓"));
  else { const el=document.getElementById("io"); el.value=t; el.select(); document.execCommand("copy"); alertMsg("Copied ✓"); }
}
function doImport(){
  try{
    const obj = JSON.parse(document.getElementById("io").value);
    Object.keys(obj).forEach(d=>{ DB[d] = Object.assign(DB[d]||{}, obj[d]); });
    saveDB(DB); alertMsg("Imported ✓"); render();
  }catch(e){ alertMsg("Couldn't parse that — is it the full JSON?"); }
}
function alertMsg(m){ const pb=document.getElementById("phaseband"); pb.style.display="block"; pb.innerHTML="<b>"+m+"</b>"; setTimeout(render,1200); }

render();
</script>
</body>
</html>
