<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1420">
<title>NYC26 — Adam's Training Log</title>
<style>
:root{
  --bg:#0f1420; --card:#1a2232; --card2:#212c42; --line:#2c3a55;
  --txt:#e8edf7; --dim:#8b98b3; --accent:#4f8ef7; --green:#3ecf8e;
  --orange:#f5a623; --red:#ef6461;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:84px}
header{padding:18px 16px 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:5}
h1{font-size:18px;font-weight:800;letter-spacing:.3px}
.sub{color:var(--dim);font-size:12px;margin-top:3px}
.countdown{color:var(--orange);font-weight:700}
.phase-band{margin:10px 16px 0;padding:9px 12px;border-radius:10px;font-size:12.5px;line-height:1.45;background:var(--card2);border:1px solid var(--line);color:var(--dim)}
.phase-band b{color:var(--txt)}
main{padding:8px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.session-label{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin:14px 4px 8px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-name{font-size:15.5px;font-weight:700}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--dim);margin-left:6px;vertical-align:middle}
.target{color:var(--dim);font-size:12.5px;margin-top:3px}
.desc{color:var(--dim);font-size:12px;margin-top:5px;font-style:italic;line-height:1.4}
.howto{display:inline-block;margin-top:7px;font-size:12px;font-weight:700;color:var(--accent);text-decoration:none;background:var(--card2);border:1px solid var(--line);padding:5px 10px;border-radius:8px}
.cardio-in{flex:1;min-width:0;height:42px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:0 10px;font-size:13px;outline:none;margin-bottom:0}
.cardio-in::placeholder{color:#5b6880}
.sum-card{background:linear-gradient(160deg,#1b2436,#141b2b);border:1px solid #33436b;border-radius:18px;overflow:hidden;margin-top:8px}
.sum-head{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.sum-title{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--accent)}
.sum-date{font-size:13px;color:var(--dim);margin-top:3px}
.sum-session{font-size:16px;font-weight:800;margin-top:4px}
.sum-row{padding:9px 16px;border-bottom:1px solid #1e2941}
.sum-ex{font-size:13.5px;font-weight:700}
.sum-sets{font-size:13px;color:var(--dim);margin-top:1px;font-variant-numeric:tabular-nums}
.sum-note{font-size:11.5px;color:var(--orange);font-style:italic;margin-top:2px}
.sum-foot{display:flex;justify-content:space-between;padding:12px 16px;font-size:11px;color:var(--dim);border-top:1px solid var(--line)}
.last{margin-top:7px;font-size:12.5px;color:var(--green)}
.last.none{color:var(--dim)}
.coach{margin-top:5px;font-size:12.5px;font-weight:600;color:var(--orange,#f0a24a)}
.sets{margin-top:10px}
.setrow{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.setnum{width:20px;color:var(--dim);font-size:12px;font-weight:700}
.stepper{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:38px;height:40px;background:none;border:none;color:var(--accent);font-size:20px;font-weight:700}
.stepper input{width:52px;height:40px;background:none;border:none;color:var(--txt);font-size:15px;font-weight:700;text-align:center;outline:none}
.stepper .unit{color:var(--dim);font-size:10px;padding-right:8px}
.done-btn{margin-left:auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--dim);font-size:17px}
.done-btn.on{background:var(--green);border-color:var(--green);color:#08281a}
.addset{background:none;border:1px dashed var(--line);color:var(--dim);border-radius:10px;padding:8px;width:100%;font-size:12.5px;margin-top:2px}
.notes{width:100%;margin-top:9px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:9px;font-size:13px;font-family:inherit;resize:none}
.notes::placeholder{color:#5b6880}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(15,20,32,.97);border-top:1px solid var(--line);backdrop-filter:blur(8px);z-index:10}
nav button{flex:1;background:none;border:none;color:var(--dim);padding:11px 0 max(11px, env(safe-area-inset-bottom));font-size:10.5px;font-weight:600}
nav button .ic{display:block;font-size:19px;margin-bottom:2px}
nav button.on{color:var(--accent)}
.timer{position:fixed;bottom:76px;left:12px;right:12px;background:var(--accent);color:#fff;border-radius:14px;padding:12px 16px;display:none;align-items:center;justify-content:space-between;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.timer.show{display:flex}
.timer .t{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.timer button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;padding:7px 13px;font-weight:700;font-size:13px}
.daynav{display:flex;gap:5px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.daynav::-webkit-scrollbar{display:none}
.daybtn{flex:0 0 auto;min-width:46px;padding:7px 6px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:11px;text-align:center;font-weight:600}
.daybtn .dd{font-size:14px;color:var(--txt);font-weight:800;display:block}
.daybtn.on{border-color:var(--accent);background:#1b2b4d;color:var(--accent)}
.daybtn.on .dd{color:var(--accent)}
.wk-row{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);font-size:13px;gap:8px}
.wk-row:last-child{border:none}
.wk-row .l{color:var(--dim);flex-shrink:0}
.wk-row .r{text-align:right;line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--dim);font-weight:600;padding:7px 6px;border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
td{padding:8px 6px;border-bottom:1px solid #1e2941;vertical-align:top;line-height:1.4}
tr.cur td{background:#1b2b4d}
.ph-Build{color:var(--green)} .ph-Peak{color:var(--orange)} .ph-Taper{color:var(--accent)} .ph-RACE{color:var(--red);font-weight:700}
select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);padding:12px;border-radius:12px;font-size:15px;margin-bottom:10px}
.hist-sess{border-bottom:1px solid var(--line);padding:10px 2px}
.hist-sess:last-child{border:none}
.hist-date{font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
.hist-sets{font-size:14.5px;font-weight:700;margin-top:3px}
.hist-note{font-size:12px;color:var(--orange);margin-top:3px;font-style:italic}
.trend-up{color:var(--green)} .trend-flat{color:var(--dim)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:14px;font-weight:600;margin-bottom:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.warn{background:#3a2b18;border:1px solid #6b4a1c;color:var(--orange);border-radius:12px;padding:11px;font-size:12.5px;line-height:1.5;margin-bottom:10px}
.io{width:100%;height:120px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:11px;padding:8px;font-family:monospace;margin-bottom:8px}
.rest-hint{font-size:11px;color:var(--dim);margin-left:4px}
h2{font-size:15px;margin:6px 4px 10px}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:30px 10px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>NYC26 TRAINING LOG</h1>
  <div class="sub" id="subhead"></div>
</header>
<div class="phase-band" id="phaseband"></div>
<main id="main"></main>

<div class="timer" id="timer">
  <div><div style="font-size:10px;font-weight:700;opacity:.8">REST</div><div class="t" id="timer-t">1:00</div></div>
  <div style="display:flex;gap:8px">
    <button onclick="Timer.add(30)">+30s</button>
    <button onclick="Timer.stop()">Done</button>
  </div>
</div>

<nav>
  <button id="nav-today" class="on" onclick="go('today')"><span class="ic">🏋️</span>Today</button>
  <button id="nav-fuel" onclick="go('fuel')"><span class="ic">🍽️</span>Fuel</button>
  <button id="nav-week" onclick="go('week')"><span class="ic">📅</span>Week</button>
  <button id="nav-history" onclick="go('history')"><span class="ic">📈</span>History</button>
  <button id="nav-plan" onclick="go('plan')"><span class="ic">🗺️</span>Plan</button>
  <button id="nav-data" onclick="go('data')"><span class="ic">💾</span>Data</button>
</nav>

<script>
const PLAN = {"race":"2026-11-01","week1":"2026-07-27","weeks":[{"wk":1,"phase":"Build","strength":"Adjusted week (post-illness) - see Week 1 tab. 2 upper days, legs Thu, optional legs Sun."},{"wk":2,"phase":"Build","strength":"Rep schemes changed: lower body main lifts go HEAVY and short (3-5), upper body stays in hypertrophy range. Week shuffled around Friday's dinner - long run moves to FRIDAY."},{"wk":3,"phase":"Build","strength":"Full volume. Progress lifts."},{"wk":4,"phase":"Build (down)","strength":"Down week: -1 set on everything, same weights. Recovery is training."},{"wk":5,"phase":"Build","strength":"Full volume. Progress lifts."},{"wk":6,"phase":"Build","strength":"Full volume. Last week of heavy lower-body progression."},{"wk":7,"phase":"Peak","strength":"Lower body -> maintenance: -1 set, same weights. Upper keeps progressing."},{"wk":8,"phase":"Peak (down)","strength":"Lower maintenance. Upper also -1 set this week."},{"wk":9,"phase":"Peak","strength":"Lower maintenance. Upper progressing."},{"wk":10,"phase":"Peak","strength":"Lower maintenance. Upper progressing."},{"wk":11,"phase":"Peak","strength":"Lower maintenance, lighter. Last hard upper week."},{"wk":12,"phase":"Taper","strength":"Lower 1x light (Tue only). Upper 2x at -30% volume."},{"wk":13,"phase":"Taper","strength":"Upper 2x light pump only. No lower-body lifting - legs are saving up."},{"wk":14,"phase":"RACE WEEK","strength":"Mon: bodyweight circuit only. Nothing after Tuesday. Race Sunday 11/1. Trust the taper."}],"template":{"Monday":{"label":"Upper A - Push + Loaded Core","items":[{"ex":"Inchworm to Worlds Greatest","grp":"Warm-up","wt":"BW","sets":2,"reps":"5","rest":null,"notes":null,"desc":"Plus arm circles","cue":"Walk hands to plank, step foot outside hand, rotate and reach to the sky.","yt":"https://www.youtube.com/results?search_query=worlds+greatest+stretch+tutorial"},{"ex":"Bench Press","grp":"Upper Body","wt":null,"sets":4,"reps":"6-10","rest":120,"notes":null,"desc":"Main lift. Double progression: 4x8 then add weight. Stop 1-2 reps short of failure.","cue":"Feet planted, shoulder blades pinched, bar to mid-chest, press up and slightly back.","yt":"https://www.youtube.com/results?search_query=bench+press+proper+form"},{"ex":"Incline DB Press","grp":"Upper Body","wt":null,"sets":3,"reps":"8-12","rest":90,"notes":null,"desc":"Upper chest - the 'lean + defined' builder Stop 1-2 reps short of failure.","cue":"Bench at 30-45\u00b0, elbows ~45\u00b0 from body, deep stretch at the bottom, press up and in.","yt":"https://www.youtube.com/results?search_query=incline+dumbbell+press+form"},{"ex":"Overhead Shoulder Press","grp":"Shoulders","wt":null,"sets":3,"reps":"6-10","rest":120,"notes":null,"desc":"Barbell or DB, standing Stop 1-2 reps short of failure.","cue":"Squeeze glutes, ribs down, press to lockout with biceps by ears.","yt":"https://www.youtube.com/results?search_query=overhead+press+proper+form"},{"ex":"Lateral Raises","grp":"Shoulders","wt":null,"sets":3,"reps":"12-15","rest":60,"notes":null,"desc":"Light, strict, chase the burn Last set genuinely close to failure - that's where the growth is.","cue":"Slight elbow bend, lead with elbows to shoulder height, zero swinging.","yt":"https://www.youtube.com/results?search_query=lateral+raise+proper+form"},{"ex":"Tricep Extensions","grp":"Upper Body","wt":null,"sets":3,"reps":"12-15","rest":60,"notes":"Superset w/ Pallof Press","desc":"Rope machine Last set genuinely close to failure - that's where the growth is.","cue":"Elbows pinned to your sides, full lockout, slow return.","yt":"https://www.youtube.com/results?search_query=cable+tricep+pushdown+form"},{"ex":"Cable Crunch","grp":"Core / Mobility","wt":null,"sets":3,"reps":"10-15","rest":60,"notes":null,"desc":"MAIN ab builder. Progress it like bench: when you hit 3x15, add weight.","cue":"Kneel facing the stack, rope behind your head. Crunch by rounding your spine down toward your knees - hips stay put, it's all abs. THE ab mass builder because you can load it.","yt":"https://www.youtube.com/results?search_query=cable+crunch+proper+form"},{"ex":"Captain's Chair Knee Raises","grp":"Core / Mobility","wt":"BW","sets":3,"reps":"10-15","rest":60,"notes":null,"desc":"Progression: bent knees -> straight legs -> DB held between the feet.","cue":"Forearms on the pads, back against the rest. Drive the knees toward your chest and curl the pelvis UP at the top - if your hips never move it's all hip flexor. Slow down, no swinging.","yt":"https://www.youtube.com/results?search_query=captains+chair+knee+raise+form"},{"ex":"Pallof Press","grp":"Core / Mobility","wt":null,"sets":2,"reps":"10/side","rest":45,"notes":null,"desc":"Anti-rotation - running posture","cue":"Cable at chest height, press straight out and hold - resist the rotation.","yt":"https://www.youtube.com/results?search_query=pallof+press+form"},{"ex":"Interval Row","grp":"Cross-training","wt":null,"sets":1,"reps":"10'","rest":null,"notes":null,"desc":"2' easy, then 6x 30\" hard / 30\" easy","cue":"Order is legs-body-arms; drive with the legs, arms come along last.","yt":"https://www.youtube.com/results?search_query=rowing+machine+technique"}]},"Tuesday":{"label":"Lower A - Heavy","items":[{"ex":"Body Weight Split Squat","grp":"Warm-up","wt":"BW","sets":2,"reps":"8","rest":null,"notes":null,"desc":"Plus leg swings","cue":"Long stance, back knee toward the floor, front heel planted.","yt":"https://www.youtube.com/results?search_query=split+squat+form"},{"ex":"Barbell Back Squat","grp":"Lower Body","wt":null,"sets":4,"reps":"3-5","rest":180,"notes":null,"desc":"THE lift. Leave 1-2 reps in the tank, always. NEW SCHEME: heavy triples/fives, 3 min rest, stop 1-2 reps short. Less soreness than 4x8 and better carryover to running. If a set feels grindy, that was the last one.","cue":"Big breath, brace hard, sit down between your hips to parallel, drive mid-foot.","yt":"https://www.youtube.com/results?search_query=how+to+squat+proper+form"},{"ex":"Leg Press","grp":"Lower Body","wt":null,"sets":3,"reps":"6-10","rest":120,"notes":null,"desc":"Straight after squats. Where you pile on load with no technique or back cost. Also the clean substitute for squats on a beat-up week.","cue":"Feet mid-platform, shoulder width. Lower until your thighs are near your chest WITHOUT your low back rounding off the pad. Push through mid-foot. Never lock the knees out hard.","yt":"https://www.youtube.com/results?search_query=leg+press+proper+form"},{"ex":"Romanian Deadlifts","grp":"Lower Body","wt":null,"sets":3,"reps":"6-8","rest":150,"notes":null,"desc":"Hamstrings = late-race insurance Heavier than before to match the squat. Hips back, bar close, feel the hamstrings load.","cue":"Soft knees, push hips straight back, bar sliding down thighs, flat back, feel the hamstrings.","yt":"https://www.youtube.com/results?search_query=romanian+deadlift+proper+form"},{"ex":"Bulgarian Split Squats","grp":"Lower Body","wt":null,"sets":3,"reps":"8/leg","rest":90,"notes":null,"desc":"Hold DBs when 3x8 is easy Drop this one if the session is running long - leg press and squats are the priority.","cue":"Rear foot on bench, slight forward lean, drive through the front heel.","yt":"https://www.youtube.com/results?search_query=bulgarian+split+squat+form"},{"ex":"Standing Calf Raises","grp":"Lower Body","wt":null,"sets":4,"reps":"10-12","rest":60,"notes":null,"desc":"Straight knee. Slow 3-sec lowering.","cue":"Full stretch at the bottom, pause, 3-second lowering.","yt":"https://www.youtube.com/results?search_query=standing+calf+raise+form"},{"ex":"Tibialis Raises","grp":"Lower Body","wt":null,"sets":3,"reps":"15","rest":45,"notes":null,"desc":"Shin insurance","cue":"Back against a wall, heels down, lift toes toward shins.","yt":"https://www.youtube.com/results?search_query=tibialis+raise+exercise"},{"ex":"Hip Adduction","grp":"Lower Body","wt":null,"sets":2,"reps":"12-15","rest":60,"notes":null,"desc":null,"cue":"Seated, squeeze the knees together, control the return. Groin insurance for runners.","yt":"https://www.youtube.com/results?search_query=hip+adduction+machine+form"},{"ex":"Hip Abduction","grp":"Lower Body","wt":null,"sets":2,"reps":"12-15","rest":60,"notes":null,"desc":"Glute medius. Keeps the pelvis level in single-leg stance - the pattern behind most IT band and lateral knee grumbles.","cue":"Seated, push the knees apart against the pads. Slow on the way back in. This is glute medius - the muscle that stops your pelvis dropping on every stride.","yt":"https://www.youtube.com/results?search_query=hip+abduction+machine+form"}]},"Wednesday":{"label":"Upper B - Pull + Obliques/Core","items":[{"ex":"Elbow to Opposite Knee Marching","grp":"Warm-up","wt":"BW","sets":2,"reps":"10","rest":null,"notes":null,"desc":"Plus arm circles","cue":"Tall posture, slow controlled march, elbow to opposite knee.","yt":"https://www.youtube.com/results?search_query=standing+elbow+to+knee+march+warm+up"},{"ex":"Pull-Up","grp":"Back","wt":"BW","sets":4,"reps":"6-10","rest":120,"notes":null,"desc":"Use lat pulldown if <6 reps. Add weight at 4x10.","cue":"From a dead hang, drive elbows down, chin clears the bar, control the descent.","yt":"https://www.youtube.com/results?search_query=pull+up+proper+form"},{"ex":"Chest-Supported Row","grp":"Back","wt":null,"sets":3,"reps":"8-12","rest":90,"notes":null,"desc":"Machine or incline bench DB row Stop 1-2 reps short of failure.","cue":"Chest stays on the pad, pull elbows back, 1-sec squeeze.","yt":"https://www.youtube.com/results?search_query=chest+supported+dumbbell+row+form"},{"ex":"Single Arm Bent Over Row","grp":"Back","wt":null,"sets":3,"reps":"10-12/side","rest":75,"notes":null,"desc":"Stop 1-2 reps short of failure.","cue":"Flat back, pull to your hip, no torso twist.","yt":"https://www.youtube.com/results?search_query=single+arm+dumbbell+row+form"},{"ex":"Cable Face Pulls","grp":"Back","wt":null,"sets":3,"reps":"12-15","rest":60,"notes":null,"desc":"Rear delts + posture - keep these forever Last set genuinely close to failure - that's where the growth is.","cue":"Pull rope to your face, elbows high, finish thumbs-back.","yt":"https://www.youtube.com/results?search_query=face+pull+proper+form"},{"ex":"Bicep Curls","grp":"Upper Body","wt":null,"sets":3,"reps":"10-15","rest":60,"notes":"Superset w/ hammer curls","desc":"Last set genuinely close to failure - that's where the growth is.","cue":"Elbows glued to sides, full range, control the lowering.","yt":"https://www.youtube.com/results?search_query=bicep+curl+proper+form"},{"ex":"Hammer Curls","grp":"Upper Body","wt":null,"sets":2,"reps":"12-15","rest":60,"notes":null,"desc":"Last set genuinely close to failure - that's where the growth is.","cue":"Neutral grip, squeeze at the top, no swinging.","yt":"https://www.youtube.com/results?search_query=hammer+curl+form"},{"ex":"Cable Wood Chops","grp":"Core / Mobility","wt":null,"sets":3,"reps":"12/side","rest":60,"notes":null,"desc":"Obliques - add weight over time","cue":"Rotate from the torso, arms stay long, pivot the back foot. Control it back - don't let the stack yank you.","yt":"https://www.youtube.com/results?search_query=cable+woodchop+form"},{"ex":"Suitcase Carry","grp":"Core / Mobility","wt":null,"sets":3,"reps":"30s/side","rest":60,"notes":null,"desc":"Heavy DB one hand, walk tall. Log the weight.","cue":"Heavy dumbbell in ONE hand, walk tall without leaning. Obliques fight the tilt. Brutal and great for running posture.","yt":"https://www.youtube.com/results?search_query=suitcase+carry+form"},{"ex":"Side Planks","grp":"Core / Mobility","wt":"BW","sets":2,"reps":"30-45s","rest":45,"notes":null,"desc":"Per side. Add a plate on the hip when easy.","cue":"Straight line ear to ankle, hips high, don't let them sag.","yt":"https://www.youtube.com/results?search_query=side+plank+form"}]},"Thursday":{"label":"Lower B - Athletic","items":[{"ex":"Pogos","grp":"Cross-training","wt":"BW","sets":3,"reps":"20","rest":60,"notes":null,"desc":"FIRST, while fresh. Quick ground contacts.","cue":"Stiff ankles, bounce like a spring off the ground, minimal knee bend, quick contacts.","yt":"https://www.youtube.com/results?search_query=pogo+jumps+plyometric+tutorial"},{"ex":"Single-Leg Hip Thrust","grp":"Lower Body","wt":"BW","sets":3,"reps":"8-10","rest":90,"notes":null,"desc":"Per leg. No barbell needed - your default now. DB on hip when 3x10 is easy. Load it: DB on the hip once 3x10 is easy.","cue":"Upper back on bench, one foot planted, other leg lifted. Drive through the heel to full lockout, squeeze 1 sec. Add a DB on the hip when 3x10 gets easy.","yt":"https://www.youtube.com/results?search_query=single+leg+hip+thrust+form"},{"ex":"Step-Ups","grp":"Lower Body","wt":null,"sets":3,"reps":"8/leg","rest":90,"notes":null,"desc":"Knee-height box, control the way down","cue":"Whole foot on a knee-height box, drive through the heel, control the way down.","yt":"https://www.youtube.com/results?search_query=dumbbell+step+up+form"},{"ex":"Single-Leg RDL","grp":"Lower Body","wt":null,"sets":3,"reps":"8/leg","rest":90,"notes":null,"desc":"Balance + hamstrings","cue":"Hinge at the hip, back flat, reach toward the floor, squeeze the glute to stand.","yt":"https://www.youtube.com/results?search_query=single+leg+romanian+deadlift+form"},{"ex":"Seated Calf Raises","grp":"Lower Body","wt":null,"sets":3,"reps":"12-15","rest":60,"notes":null,"desc":"Soleus - the marathon muscle","cue":"Bent knee hits the soleus - slow, full range.","yt":"https://www.youtube.com/results?search_query=seated+calf+raise+form"},{"ex":"Leg Press Ankle-Iso Push","grp":"Lower Body","wt":null,"sets":3,"reps":"4","rest":60,"notes":null,"desc":"Push hard 4 sec, rest 4 sec, x4 = 1 set","cue":"Push hard into the sled through your toes for 4 sec, rest 4 sec, repeat x4 = 1 set.","yt":"https://www.youtube.com/results?search_query=isometric+calf+push+leg+press"},{"ex":"Copenhagen Plank","grp":"Core / Mobility","wt":"BW","sets":3,"reps":"20-30s","rest":45,"notes":null,"desc" arch_query=rowing+machine+technique"}]},"Wednesday":{"label":"AM: 4 mi treadmill w/ 4x800s (3:41 / 3:51 / 3:39 / 3:33)  |  No lift - Lower A moved to Saturday","items":[{"ex":"Full Rest Day","grp":null,"wt":null,"sets":null,"reps":null,"rest":null,"notes":null,"desc":"Work won this one. The 800s got done and that was the session that mattered - fastest rep was the last one, on four hours of sleep and a treadmill. Speed is not your limiter.","cue":null,"yt":null}]},"Thursday":{"label":"Midday: 2.5 mi easy (finishing yesterday's 6)  |  PM: Upper B - Pull + Obliques/Core   <- legs get NOTHING","items":[{"ex":"Elbow to Opposite Knee Marching","grp":"Warm-up","wt":"BW","sets":2,"reps":"10","rest":null,"notes":null,"desc":"Plus arm circles","cue":"Tall posture, slow controlled march, elbow to opposite knee.","yt":"https://www.youtube.com/results?search_query=standing+elbow+to+knee+march+warm+up"},{"ex":"Pull-Up","grp":"Back","wt":"BW","sets":4,"reps":"6-10","rest":120,"notes":null,"desc":"Use lat pulldown if <6 reps. Add weight at 4x10.","cue":"From a dead hang, drive elbows down, chin clears the bar, control the descent.","yt":"https://www.youtube.com/results?search_query=pull+up+proper+form"},{"ex":"Chest-Supported Row","grp":"Back","wt":null,"sets":3,"reps":"8-12","rest":90,"notes":null,"desc":"Machine or incline bench DB row Stop 1-2 reps short of failure.","cue":"Chest stays on the pad, pull elbows back, 1-sec squeeze.","yt":"https://www.youtube.com/results?search_query=chest+supported+dumbbell+row+form"},{"ex":"Single Arm Bent Over Row","grp":"Back","wt":null,"sets":3,"reps":"10-12/side","rest":75,"notes":null,"desc":"Stop 1-2 reps short of failure.","cue":"Flat back, pull to your hip, no torso twist.","yt":"https://www.youtube.com/results?search_query=single+arm+dumbbell+row+form"},{"ex":"Cable Face Pulls","grp":"Back","wt":null,"sets":3,"reps":"12-15","rest":60,"notes":null,"desc":"Rear delts + posture - keep these forever Last set genuinely close to failure - that's where the growth is.","cue":"Pull rope to your face, elbows high, finish thumbs-back.","yt":"https://www.youtube.com/results?search_query=face+pull+proper+form"},{"ex":"Bicep Curls","grp":"Upper Body","wt":null,"sets":3,"reps":"10-15","rest":60,"notes":"Superset w/ hammer curls","desc":"Last set genuinely close to failure - that's where the growth is.","cue":"Elbows glued to sides, full range, control the lowering.","yt":"https://www.youtube.com/results?search_query=bicep+curl+proper+form"},{"ex":"Hammer Curls","grp":"Upper Body","wt":null,"sets":2,"reps":"12-15","rest":60,"notes":null,"desc":"Last set genuinely close to failure - that's where the growth is.","cue":"Neutral grip, squeeze at the top, no swinging.","yt":"https://www.youtube.com/results?search_query=hammer+curl+form"},{"ex":"Cable Wood Chops","grp":"Core / Mobility","wt":null,"sets":3,"reps":"12/side","rest":60,"notes":null,"desc":"Obliques - add weight over time","cue":"Rotate from the torso, arms stay long, pivot the back foot. Control it back - don't let the stack yank you.","yt":"https://www.youtube.com/results?search_query=cable+woodchop+form"},{"ex":"Suitcase Carry","grp":"Core / Mobility","wt":null,"sets":3,"reps":"30s/side","rest":60,"notes":null,"desc":"Heavy DB one hand, walk tall. Log the weight.","cue":"Heavy dumbbell in ONE hand, walk tall without leaning. Obliques fight the tilt. Brutal and great for running posture.","yt":"https://www.youtube.com/results?search_query=suitcase+carry+form"},{"ex":"Side Planks","grp":"Core / Mobility","wt":"BW","sets":2,"reps":"30-45s","rest":45,"notes":null,"desc":"Per side. Add a plate on the hip when easy.","cue":"Straight line ear to ankle, hips high, don't let them sag.","yt":"https://www.youtube.com/results?search_query=side+plank+form"}]},"Friday":{"label":"AM: 12 mi w/ 1 mi @ marathon effort around mile 8-9  |  No lift - dinner at Yuu tonight","items":[{"ex":"Long Run - 12 mi","grp":null,"wt":null,"sets":null,"reps":null,"rest":null,"notes":null,"desc":"Start early, before the dew point wakes up. Easy for the first 7. Put the mile repeat in around mile 8-9 at marathon EFFORT (not pace - the humidity owns the pace), then 2-3 easy miles after to practice settling back down. Carry fluid + electrolytes.","cue":null,"yt":null},{"ex":"Stretching","grp":"Core / Mobility","wt":null,"sets":null,"reps":null,"rest":null,"notes":null,"desc":"10 min after: hips, hamstrings, calves. Then go enjoy your dinner.","cue":"Hit quads, hamstrings, calves, hips - 30-45s per hold.","yt":"https://www.youtube.com/results?search_query=post+run+stretching+routine"}]},"Saturday":{"label":"Lower A - HEAVY (moved from Wednesday). Day after the 12: heavy but CRISP.","items":[{"ex":"Body Weight Split Squat","grp":"Warm-up","wt":"BW","sets":2,"reps":"8","rest":null,"notes":null,"desc":"Plus leg swings","cue":"Long stance, back knee toward the floor, front heel planted.","yt":"https://www.youtube.com/results?search_query=split+squat+form"},{"ex":"Barbell Back Squat","grp":"Lower Body","wt":null,"sets":4,"reps":"3-5","rest":180,"notes":null,"desc":"THE lift. Leave 1-2 reps in the tank, always. NEW SCHEME: heavy triples/fives, 3 min rest, stop 1-2 reps short. Less soreness than 4x8 and better carryover to running. If a set feels grindy, that was the last one.","cue":"Big breath, brace hard, sit down between your hips to parallel, drive mid-foot.","yt":"https://www.youtube.com/results?search_query=how+to+squat+proper+form"},{"ex":"Leg Press","grp":"Lower Body","wt":null,"sets":3,"reps":"6-10","rest":120,"notes":null,"desc":"Straight after squats. Where you pile on load with no technique or back cost. Also the clean substitute for squats on a beat-up week.","cue":"Feet mid-platform, shoulder width. Lower until your thighs are near your chest WITHOUT your low back rounding off the pad. Push through mid-foot. Never lock the knees out hard.","yt":"https://www.youtube.com/results?search_query=leg+press+proper+form"},{"ex":"Romanian Deadlifts","grp":"Lower Body","wt":null,"sets":3,"reps":"6-8","rest":150,"notes":null,"desc":"Hamstrings = late-race insurance Heavier than before to match the squat. Hips back, bar close, feel the hamstrings load.","cue":"Soft knees, push hips straight back, bar sliding down thighs, flat back, feel the hamstrings.","yt":"https://www.youtube.com/results?search_query=romanian+deadlift+proper+form"},{"ex":"Bulgarian Split Squats","grp":"Lower Body","wt":null,"sets":3,"reps":"8/leg","rest":90,"notes":null,"desc":"Hold DBs when 3x8 is easy Drop this one if the session is running long - leg press and squats are the priority.","cue":"Rear foot on bench, slight forward lean, drive through the front heel.","yt":"https://www.youtube.com/results?search_query=bulgarian+split+squat+form"},{"ex":"Standing Calf Raises","grp":"Lower Body","wt":null,"sets":4,"reps":"10-12","rest":60,"notes":null,"desc":"Straight knee. Slow 3-sec lowering.","cue":"Full stretch at the bottom, pause, 3-second lowering.","yt":"https://www.youtube.com/results?search_query=standing+calf+raise+form"},{"ex":"Tibialis Raises","grp":"Lower Body","wt":null,"sets":3,"reps":"15","rest":45,"notes":null,"desc":"Shin insurance","cue":"Back against a wall, heels down, lift toes toward shins.","yt":"https://www.youtube.com/results?search_query=tibialis+raise+exercise"},{"ex":"Hip Adduction","grp":"Lower Body","wt":null,"sets":2,"reps":"12-15","rest":60,"notes":null,"desc":null,"cue":"Seated, squeeze the knees together, control the return. Groin insurance for runners.","yt":"https://www.youtube.com/results?search_query=hip+adduction+machine+form"},{"ex":"Hip Abduction","grp":"Lower Body","wt":null,"sets":2,"reps":"12-15","rest":60,"notes":null,"desc":"Glute medius. Keeps the pelvis level in single-leg stance - the pattern behind most IT band and lateral knee grumbles.","cue":"Seated, push the knees apart against the pads. Slow on the way back in. This is glute medius - the muscle that stops your pelvis dropping on every stride.","yt":"https://www.youtube.com/results?search_query=hip+abduction+machine+form"}]},"Sunday":{"label":"AM: 6 mi easy (genuinely easy)  |  PM: Lower B - Athletic (light, single-leg)","items":[{"ex":"Foam Rolling","grp":"Core / Mobility","wt":null,"sets":1,"reps":"10'","rest":null,"notes":null,"desc":"Quads, calves, hamstrings, glutes - slow passes","cue":null,"yt":"https://www.youtube.com/results?search_query=Foam+Rolling+exercise+form"},{"ex":"Pogos","grp":"Cross-training","wt":"BW","sets":3,"reps":"20","rest":60,"notes":null,"desc":"FIRST, while fresh. Quick ground contacts.","cue":"Stiff ankles, bounce like a spring off the ground, minimal knee bend, quick contacts.","yt":"https://www.youtube.com/results?search_query=pogo+jumps+plyometric+tutorial"},{"ex":"Single-Leg Hip Thrust","grp":"Lower Body","wt":"BW","sets":3,"reps":"8-10","rest":90,"notes":null,"desc":"Per leg. No barbell needed - your default now. DB on hip when 3x10 is easy. Load it: DB on the hip once 3x10 is easy.","cue":"Upper back on bench, one foot planted, other leg lifted. Drive through the heel to full lockout, squeeze 1 sec. Add a DB on the hip when 3x10 gets easy.","yt":"https://www.youtube.com/results?search_query=single+leg+hip+thrust+form"},{"ex":"Step-Ups","grp":"Lower Body","wt":null,"sets":3,"reps":"8/leg","rest":90,"notes":null,"desc":"Knee-height box, control the way down","cue":"Whole foot on a knee-height box, drive through the heel, control the way down.","yt":"https://www.youtube.com/results?search_query=dumbbell+step+up+form"},{"ex":"Single-Leg RDL","grp":"Lower Body","wt":null,"sets":3,"reps":"8/leg","rest":90,"notes":null,"desc":"Balance + hamstrings","cue":"Hinge at the hip, back flat, reach toward the floor, squeeze the glute to stand.","yt":"https://www.youtube.com/results?search_query=single+leg+romanian+deadlift+form"},{"ex":"Seated Calf Raises","grp":"Lower Body","wt":null,"sets":3,"reps":"12-15","rest":60,"notes":null,"desc":"Soleus - the marathon muscle","cue":"Bent knee hits :"Squeeze glutes, ribs down, press to lockout with biceps by ears.","DB Shoulder Press":"Slight arc up and in, don't flare ribs, full lockout.","Lateral Raises":"Slight elbow bend, lead with elbows to shoulder height, zero swinging.","Front Raises":"Raise to eye level, thumbs slightly up, no momentum.","Rear Delt Flys":"Hinge forward, light weight, lead with pinkies out wide.","Tricep Extensions":"Elbows pinned to your sides, full lockout, slow return.","Skullcrushers":"Lower the bar to forehead or just behind, elbows tucked in.","Bicep Curls":"Elbows glued to sides, full range, control the lowering.","Hammer Curls":"Neutral grip, squeeze at the top, no swinging.","Incline DB Curls":"Let arms hang back for the stretch, curl without moving shoulders.","Dips":"Slight forward lean, lower to 90\u00b0 elbows, press to lockout.","Cable Chest Flys":"Soft elbows, hug-a-barrel motion, feel the stretch at the back.","Pull-Up":"From a dead hang, drive elbows down, chin clears the bar, control the descent.","Lat Pulldown":"Lean back slightly, pull bar to upper chest, elbows down not back.","Chest-Supported Row":"Chest stays on the pad, pull elbows back, 1-sec squeeze.","Single Arm Bent Over Row":"Flat back, pull to your hip, no torso twist.","Seated Row":"Tall chest, pull to belly button, squeeze shoulder blades.","Cable Face Pulls":"Pull rope to your face, elbows high, finish thumbs-back.","Pallof Press":"Cable at chest height, press straight out and hold - resist the rotation.","Dead Bugs":"Low back glued to the floor, opposite arm and leg, slow.","Side Planks":"Straight line ear to ankle, hips high, don't let them sag.","Bird Dogs":"Opposite arm and leg, hips stay level, pause at full reach.","Russian Twists":"Tall chest, rotate the shoulders not just the arms.","Hanging Leg Raises":"No swinging - curl the pelvis up, control the way down.","Copenhagen Plank":"Top leg on a bench, lift hips into a side plank - start from the knee.","Pull-Up Negatives":"Step or jump to the top (chin over bar), then lower yourself as SLOWLY as you can - 3-5 seconds down. The fastest road to your first pull-up.","Dead Hang":"Hang from the bar, arms straight, shoulders active (pulled slightly down). Build to 45-60 seconds.","Scap Pulls":"From a dead hang, pull your shoulder blades down and together WITHOUT bending your elbows - your body rises an inch or two.","Inverted Row":"Bar at waist height (Smith machine works), body straight underneath, pull chest to bar. Feet elevated = harder.","Barbell Back Squat":"Big breath, brace hard, sit down between your hips to parallel, drive mid-foot.","Romanian Deadlifts":"Soft knees, push hips straight back, bar sliding down thighs, flat back, feel the hamstrings.","Bulgarian Split Squats":"Rear foot on bench, slight forward lean, drive through the front heel.","Standing Calf Raises":"Full stretch at the bottom, pause, 3-second lowering.","Seated Calf Raises":"Bent knee hits the soleus - slow, full range.","Tibialis Raises":"Back against a wall, heels down, lift toes toward shins.","Hip Adduction":"Seated, squeeze the knees together, control the return. Groin insurance for runners.","Hip Abduction":"Seated, push the knees apart against the pads. Slow on the way back in. This is glute medius - the muscle that stops your pelvis dropping on every stride.","Hip Thrusts":"Upper back on bench, chin tucked, squeeze glutes to full lockout, 1-sec hold.","Step-Ups":"Whole foot on a knee-height box, drive through the heel, control the way down.","Single-Leg RDL":"Hinge at the hip, back flat, reach toward the floor, squeeze the glute to stand.","Leg Press Ankle-Iso Push":"Push hard into the sled through your toes for 4 sec, rest 4 sec, repeat x4 = 1 set.","Pogos":"Stiff ankles, bounce like a spring off the ground, minimal knee bend, quick contacts.","Interval Row":"Order is legs-body-arms; drive with the legs, arms come along last.","Zone 2 Row":"Easy sustainable pace - you should be able to talk. Legs drive, arms follow.","Inchworm to Worlds Greatest":"Walk hands to plank, step foot outside hand, rotate and reach to the sky.","Elbow to Opposite Knee Marching":"Tall posture, slow controlled march, elbow to opposite knee.","Body Weight Split Squat":"Long stance, back knee toward the floor, front heel planted.","Inchworm Cobra Downward Dog":"Walk out to plank, hips down chest up, then push hips high.","Stretching":"Hit quads, hamstrings, calves, hips - 30-45s per hold.","Cable Crunch":"Kneel facing the stack, rope behind your head. Crunch by rounding your spine down toward your knees - hips stay put, it's all abs. THE ab mass builder because you can load it.","Ab Wheel Rollout":"From knees, ribs pulled down, roll out only as far as you can WITHOUT your low back sagging. Come back by pulling with the abs, not the arms.","Weighted Plank":"Standard plank with a plate on your upper back. Squeeze glutes, ribs down, no sagging.","Hanging Knee Raises":"Easier version of the leg raise - knees to chest, curl the pelvis up at the top, no swinging. Progress to straight legs.","Suitcase Carry":"Heavy dumbbell in ONE hand, walk tall without leaning. Obliques fight the tilt. Brutal and great for running posture.","Cable Wood Chops":"Rotate from the torso, arms stay long, pivot the back foot. Control it back - don't let the stack yank you.","Decline Sit-Up":"Hold a plate at your chest, roll up one vertebra at a time, control the way down.","Single-Leg Hip Thrust":"Upper back on bench, one foot planted, other leg lifted. Drive through the heel to full lockout, squeeze 1 sec. Add a DB on the hip when 3x10 gets easy.","Leg Press":"Feet mid-platform, shoulder width. Lower until your thighs are near your chest WITHOUT your low back rounding off the pad. Push through mid-foot. Never lock the knees out hard.","Captain's Chair Knee Raises":"Forearms on the pads, back against the rest. Drive the knees toward your chest and curl the pelvis UP at the top - if your hips never move it's all hip flexor. Slow down, no swinging."}};
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const KEY = "nyc26-log-v1";

// ---------- storage (localStorage with in-memory fallback) ----------
let mem = {}, canStore = false;
try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); canStore = true; } catch(e) {}
function loadDB(){ if(canStore){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } } return mem; }
function saveDB(db){ if(canStore){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} } mem = db; }
let DB = loadDB();   // { "YYYY-MM-DD": { "Exercise Name": {sets:[{w,r,done}], note:""} } }

// ---------- date helpers ----------
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,dd]=s.split("-").map(Number); return new Date(y,m-1,dd); }
const WEEK1 = parseISO(PLAN.week1), RACE = parseISO(PLAN.race);
function weekOf(d){ return Math.floor((d - WEEK1)/(7*864e5)) + 1; }
function mondayOfWeek(n){ const d = new Date(WEEK1); d.setDate(d.getDate()+(n-1)*7); return d; }
let viewDate = new Date(); viewDate.setHours(0,0,0,0);
let tab = "today", histEx = null;

// ---------- phase logic ----------
function weekInfo(n){ return PLAN.weeks.find(w=>w.wk===n) || null; }
// user plan edits (from the in-app editor) — highest precedence
let planEdits = {};
try{ planEdits = JSON.parse(localStorage.getItem(KEY+"-plan")||"{}"); }catch(e){}
function savePlanEdits(){ try{ localStorage.setItem(KEY+"-plan", JSON.stringify(planEdits)); }catch(e){} }
function dayPlan(n, dayName){
  if(planEdits[dayName]) return planEdits[dayName];
  const o = PLAN.overrides && PLAN.overrides[String(n)];
  return (o && o[dayName]) || PLAN.template[dayName];
}
function allTemplates(){
  const list = [PLAN.template];
  if(PLAN.overrides) Object.values(PLAN.overrides).forEach(o=>list.push(o));
  return list;
}
function phaseAdjust(n){
  const wi = weekInfo(n); if(!wi) return null;
  if(wi.phase.startsWith("Peak")) return {lower:-1, note:"PEAK: drop 1 set from every lower-body lift. Same weights — you're maintaining, the running is the point now."};
  if(wi.phase.includes("down")||wi.phase==="Build (down)") return {lower:-1, upper:-1, note:"DOWN WEEK: −1 set on everything, same weights. Recovery is training."};
  if(wi.phase==="Taper") return {lower:-99, note:"TAPER: follow the strength notes on the Plan tab — lower body is winding down."};
  if(wi.phase==="RACE WEEK") return {lower:-99, upper:-99, note:"RACE WEEK. Bodyweight circuit Monday only. Nothing after Tuesday. Trust the taper."};
  return null;
}

// ---------- rendering ----------
function go(t){ tab=t; document.querySelectorAll("nav button").forEach(b=>b.classList.remove("on"));
  document.getElementById("nav-"+t).classList.add("on"); render(); window.scrollTo(0,0); }

function render(){
  const today = new Date(); today.setHours(0,0,0,0);
  const wkN = weekOf(today);
  const daysLeft = Math.round((RACE-today)/864e5);
  document.getElementById("subhead").innerHTML =
    (wkN>=1&&wkN<=14 ? `Week ${wkN} of 14 · ` : "") + `<span class="countdown">${daysLeft>0?daysLeft+" days to NYC":(daysLeft===0?"RACE DAY 🎉":"Race complete")}</span>`;
  const wi = weekInfo(Math.min(Math.max(weekOf(viewDate),1),14));
  const pb = document.getElementById("phaseband");
  if(wi && tab!=="data" && tab!=="history" && tab!=="summary" && tab!=="editor"){
    pb.style.display="block";
    pb.innerHTML = `<b>Week ${wi.wk} — ${wi.phase}</b><br>${wi.strength}`;
  } else pb.style.display="none";
  document.querySelector("nav").style.display = (tab==="summary") ? "none" : "flex";
  document.querySelector("header").style.display = (tab==="summary") ? "none" : "block";
  const m = document.getElementById("main");
  if(tab==="today") m.innerHTML = renderToday();
  else if(tab==="editor") m.innerHTML = renderEditor();
  else if(tab==="summary") m.innerHTML = renderSummary();
  else if(tab==="fuel") m.innerHTML = renderFuel();
  else if(tab==="week") m.innerHTML = renderWeek();
  else if(tab==="history"){ m.innerHTML = renderHistory(); const s=document.getElementById("histsel"); if(s) s.value = histEx||""; }
  else if(tab==="plan") m.innerHTML = renderPlan();
  else m.innerHTML = renderData();
}

function dayNav(){
  const start = new Date(viewDate); start.setDate(start.getDate()-3);
  let h = '<div class="daynav">';
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(d.getDate()+i);
    const on = iso(d)===iso(viewDate);
    h += `<button class="daybtn ${on?"on":""}" onclick="setDate('${iso(d)}')">${DAYS[(d.getDay()+6)%7].slice(0,3)}<span class="dd">${d.getDate()}</span></button>`;
  }
  return h+"</div>";
}
function setDate(s){ viewDate = parseISO(s); render(); }

function lastPerf(ex, beforeISO){
  const dates = Object.keys(DB).filter(d=>d<beforeISO && DB[d][ex] && DB[d][ex].sets && DB[d][ex].sets.some(s=>s.done)).sort();
  if(!dates.length) return null;
  const d = dates[dates.length-1], sets = DB[d][ex].sets.filter(s=>s.done);
  return {date:d, sets, note:DB[d][ex].note||""};
}
function lastCardio(ex, beforeISO){
  const dates = Object.keys(DB).filter(d=>d<beforeISO && DB[d][ex] && DB[d][ex].cardio && DB[d][ex].cardio.done).sort();
  if(!dates.length) return null;
  const d = dates[dates.length-1];
  return {date:d, ...DB[d][ex].cardio, note:DB[d][ex].note||""};
}
function fmtSets(sets){ return sets.map(s=>`${s.w||"BW"}×${s.r}`).join(", "); }

// Coach line: reads last performance + target range and says what to do TODAY.
// Double progression: reps to the top of the range on every set -> add weight, reps reset.
const NO_COACH = ["Stretching","Foam Rolling","Full Rest Day","Long Run - 12 mi"];
function coachTip(it, last, targetSets){
  if(!last || !last.sets.length) return "";
  // no progression prompts on warm-ups, mobility or non-loadable work
  if(!it.grp || it.grp==="Warm-up" || NO_COACH.includes(it.ex)) return "";
  const top = midReps(it.reps);              // top of target range
  const nums = String(it.reps||"").match(/\d+/g) || [];
  const bottom = nums.length ? parseInt(nums[0]) : null;
  const reps = last.sets.map(s=>parseInt(s.r)).filter(n=>!isNaN(n));
  if(!reps.length) return "";
  const best = Math.max(...reps);
  if(isTimeBased(it.reps)){
    return `<div class="coach">⬆ Beat ${best}s on at least one hold today.</div>`;
  }
  if(!top) return "";
  const ws = last.sets.map(s=>parseFloat(s.w)).filter(n=>!isNaN(n));
  const w = ws.length ? Math.max(...ws) : null;
  const enough = last.sets.length >= Math.min(targetSets||last.sets.length, last.sets.length);
  const allTop = enough && reps.every(r=>r>=top);
  if(w===null){ // bodyweight
    return allTop
      ? `<div class="coach">⬆ Topped out at bodyweight — add load (DB on hip / between feet) or add a rep beyond ${top}.</div>`
      : `<div class="coach">🎯 Beat last time: get every set to ${top}, then we load it.</div>`;
  }
  if(allTop){
    const inc = PLAN.perHand.includes(it.ex) ? 5 : 5;
    return `<div class="coach">⬆ Every set hit ${top} at ${w} — go up today (smallest jump, ~${w+inc}${PLAN.perHand.includes(it.ex)?"/hand":""}). Reps will drop back toward ${bottom??"the bottom"} — that's correct.</div>`;
  }
  return `<div class="coach">🎯 Stay at ${w} — add a rep somewhere (last: ${reps.join(", ")}). At ${top}s across the board you go up.</div>`;
}
function isCardio(ex){ return PLAN.cardio.includes(ex); }
function unitFor(ex){ return PLAN.perHand.includes(ex) ? "lb/hand" : "lb"; }
function midReps(repsStr){
  // despite the name: returns the TOP of the target range (6-8 -> 8) per Adam's preference
  if(repsStr===null||repsStr===undefined) return null;
  const nums = String(repsStr).match(/\d+/g);
  if(!nums) return null;
  return parseInt(nums[nums.length-1]);
}
function isTimeBased(repsStr){ return /\ds|max|sec/i.test(String(repsStr||"")); }
function cueFor(it){ return it.cue || (PLAN.cues && PLAN.cues[it.ex]) || null; }
function ytFor(it){
  if(it.yt) return it.yt;
  if(!it.grp) return null;
  return "https://www.youtube.com/results?search_query="+encodeURIComponent(it.ex+" exercise form");
}

function renderToday(){
  const dISO = iso(viewDate);
  const dayName = DAYS[(viewDate.getDay()+6)%7];
  const wkN = weekOf(viewDate);
  const t = dayPlan(wkN, dayName);
  const adj = (wkN>=1&&wkN<=14) ? phaseAdjust(wkN) : null;
  let h = dayNav();
  const f = fuelFor(viewDate);
  h += `<div class="card" style="padding:10px 14px;cursor:pointer" onclick="go('fuel')">
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px">
      <span>🍽️ <b>${f.cal.toLocaleString()} cal</b> · ${PLAN.fuel.protein}g protein</span>
      <span style="color:var(--dim);font-size:11.5px">${f.carb} →</span>
    </div></div>`;
  h += `<div class="session-label">${dayName} — ${t.label}</div>`;
  if(adj) h += `<div class="warn">${adj.note}</div>`;
  if(wkN<1||wkN>14) h += `<div class="warn">This date is outside the 14-week plan (Jul 27 – Nov 1). Showing the standard template.</div>`;
  t.items.forEach(it=>{
    if(!it.grp && it.ex==="Full Rest Day"){
      h += `<div class="card"><div class="ex-name">😴 ${wkN===1&&dayName==="Monday"?"Recovery Day":"Full Rest Day"}</div><div class="desc">${it.desc}</div></div>`; return;
    }
    h += exCard(it, dISO, adj);
  });
  // added exercises
  const extras = (DB[dISO] && DB[dISO].__extra) || [];
  extras.forEach((x,i)=>{
    h += exCard({ex:x.ex, grp:x.grp, wt:null, sets:3, reps:"8-12", rest:60,
      yt:"https://www.youtube.com/results?search_query="+encodeURIComponent(x.ex+" exercise form"),
      extraIdx:i}, dISO, adj);
  });
  // add-exercise UI
  if(addxOpen){
    const grps = Object.keys(PLAN.groups);
    const g = addxGrp || grps[0];
    const customs = customExercises();
    h += `<div class="card"><div style="font-weight:700;font-size:13px;margin-bottom:8px">Add an exercise</div>
      <select id="addx-grp" onchange="addxSetGrp(this.value)">${grps.map(x=>`<option ${x===g?"selected":""}>${x}</option>`).join("")}</select>
      <select id="addx-ex">${PLAN.groups[g].map(x=>`<option>${x}</option>`).join("")}${customs.map(x=>`<option>${x}</option>`).join("")}<option value="__custom__">✏️ Type my own…</option></select>
      <input id="addx-custom" class="cardio-in" style="width:100%;margin-bottom:10px" placeholder="Custom exercise name (if 'Type my own')">
      <div style="display:flex;gap:8px">
        <button class="btn primary" style="margin:0" onclick="addExtra('${dISO}')">Add</button>
        <button class="btn" style="margin:0" onclick="toggleAddx()">Cancel</button>
      </div></div>`;
  } else {
    h += `<button class="addset" style="margin-bottom:10px" onclick="toggleAddx()">+ Add exercise</button>`;
  }
  // finish
  const finished = DB[dISO] && DB[dISO].__day && DB[dISO].__day.finished;
  h += `<button class="btn primary" style="margin-top:4px" onclick="finishWorkout('${dISO}')">${finished?"View workout summary 📸":"🏁 Finish workout → summary"}</button>`;
  return h;
}

// ---------- day summary ----------
function renderSummary(){
  const dISO = iso(viewDate);
  const dayName = DAYS[(viewDate.getDay()+6)%7];
  const wkN = Math.min(Math.max(weekOf(viewDate),1),14);
  const t = dayPlan(wkN, dayName);
  const wi = weekInfo(wkN);
  const day = DB[dISO] || {};
  const daysLeft = Math.round((RACE - viewDate)/864e5);
  let rows = "";
  let setCount = 0;
  Object.keys(day).filter(k=>!k.startsWith("__")).forEach(ex=>{
    const e = day[ex];
    if(e.cardio && e.cardio.done){
      rows += `<div class="sum-row"><div class="sum-ex">${ex}</div><div class="sum-sets">${[e.cardio.dur,e.cardio.split].filter(Boolean).join(" · ")||"done ✓"}</div>${e.note?`<div class="sum-note">"${e.note}"</div>`:""}</div>`;
      return;
    }
    const sets = (e.sets||[]).filter(s=>s.done);
    if(!sets.length) return;
    setCount += sets.length;
    const best = Math.max(...sets.map(s=>parseFloat(s.w)||0));
    const prev = lastPerf(ex, dISO);
    const prevBest = prev ? Math.max(...prev.sets.map(s=>parseFloat(s.w)||0)) : null;
    const arrow = prevBest===null ? "" : (best>prevBest ? ' <span class="trend-up">▲</span>' : (best===prevBest ? "" : ' <span style="color:var(--red)">▼</span>'));
    rows += `<div class="sum-row"><div class="sum-ex">${ex}${arrow}</div><div class="sum-sets">${fmtSets(sets)}</div>${e.note?`<div class="sum-note">"${e.note}"</div>`:""}</div>`;
  });
  const checks = (day.__fuel && day.__fuel.checks) || {};
  const nChecked = Object.values(checks).filter(Boolean).length;
  const f = fuelFor(viewDate);
  let h = `<div class="sum-card">
    <div class="sum-head">
      <div class="sum-title">NYC26 TRAINING LOG</div>
      <div class="sum-date">${dayName}, ${viewDate.toLocaleDateString("en-US",{month:"short",day:"numeric"})} · Week ${wkN} — ${wi?wi.phase:""}</div>
      <div class="sum-session">${t.label}</div>
    </div>
    ${rows || '<div class="empty" style="padding:16px">Nothing logged yet for this day.</div>'}
    <div class="sum-foot">
      <span>${setCount} sets</span><span>🍽️ ${nChecked} fuel checks · ${f.cal.toLocaleString()} cal target</span><span>${daysLeft>0?daysLeft+"d to NYC":"🎉"}</span>
    </div>
  </div>
  <button class="btn primary" onclick="shareSummary()">📤 Share</button>
  <button class="btn" onclick="go('today')">← Back to Today</button>`;
  return h;
}

function exCard(it, dISO, adj){
  const log = (DB[dISO]&&DB[dISO][it.ex]) || null;
  const isLower = it.grp==="Lower Body";
  const isUpper = ["Upper Body","Back","Shoulders"].includes(it.grp);
  let targetSets = it.sets;
  if(targetSets && adj){
    if(isLower && adj.lower===-1) targetSets = Math.max(1,targetSets-1);
    if(isUpper && adj.upper===-1) targetSets = Math.max(1,targetSets-1);
  }
  const last = lastPerf(it.ex, dISO);
  const eid = btoa(unescape(encodeURIComponent(it.ex))).replace(/=/g,"");
  let h = `<div class="card" id="card-${eid}">
    <div class="ex-head"><div>
      <span class="ex-name">${it.ex}</span>${it.grp?`<span class="chip">${it.grp}</span>`:""}
      <div class="target">${targetSets?`Target: ${targetSets} × ${it.reps||"?"}`:(it.reps?`Target: ${it.reps}`:"")}${it.rest?` <span class="rest-hint">rest ${it.rest}s</span>`:""}</div>
      ${cueFor(it)?`<div class="desc">💡 ${cueFor(it)}</div>`:""}
      ${it.desc?`<div class="desc">${it.desc}</div>`:""}${it.notes?`<div class="desc">📌 ${it.notes}</div>`:""}
      ${ytFor(it)?`<a class="howto" href="${ytFor(it)}" target="_blank" rel="noopener">▶ Watch how-to</a>`:""}
    </div>${it.extraIdx!==undefined?`<button class="done-btn" style="flex-shrink:0" onclick="removeExtra('${dISO}',${it.extraIdx})">✕</button>`:""}</div>`;
  if(isCardio(it.ex)){
    const lc = lastCardio(it.ex, dISO);
    h += lc ? `<div class="last">Last time (${lc.date.slice(5).replace("-","/")}): ${[lc.dur,lc.split].filter(Boolean).join(" · ")}${lc.note?` — "${lc.note}"`:""}</div>`
            : `<div class="last none">First time logging this — set your baseline.</div>`;
    const c = (log && log.cardio) || {dur:"",split:"",done:false};
    h += `<div class="sets">
      <div class="setrow">
        <input class="cardio-in" placeholder="time / duration (e.g. 10 min)" value="${c.dur||""}" oninput="setCardio('${dISO}','${eid}','dur',this.value)">
        <input class="cardio-in" placeholder="split / distance (e.g. 2:20/500m)" value="${c.split||""}" oninput="setCardio('${dISO}','${eid}','split',this.value)">
        <button class="done-btn ${c.done?"on":""}" onclick="toggleCardioDone('${dISO}','${eid}')">✓</button>
      </div></div>`;
  } else {
    h += last ? `<div class="last">Last time (${last.date.slice(5).replace("-","/")}): ${fmtSets(last.sets)}${last.note?` — "${last.note}"`:""}</div>${coachTip(it, last, targetSets)}`
              : `<div class="last none">First time logging this — set your baseline.</div>`;
    const nSets = Math.max(log ? log.sets.length : 0, targetSets||1);
    const mid = midReps(it.reps);
    const tUnit = isTimeBased(it.reps) ? "secs" : "reps";
    h += `<div class="sets">`;
    for(let i=0;i<nSets;i++){
      const s = log&&log.sets[i] ? log.sets[i] : {w:(last&&last.sets[i]?last.sets[i].w:(last&&last.sets[0]?last.sets[0].w:"")), r:"", done:false};
      const prefR = (s.r!=="" && s.r!==undefined && s.r!==null) ? s.r : ((last&&last.sets[i]&&last.sets[i].r) || mid || "");
      const prefRN = isNaN(parseInt(prefR)) ? "null" : parseInt(prefR);
      const prefWN = isNaN(parseFloat(s.w)) ? "null" : parseFloat(s.w);
      h += `<div class="setrow">
        <span class="setnum">${i+1}</span>
        <div class="stepper"><button onclick="bump('${dISO}','${eid}',${i},'w',-1,${prefWN})">−</button><input inputmode="decimal" value="${s.w!==undefined?s.w:""}" placeholder="wt" oninput="setVal('${dISO}','${eid}',${i},'w',this.value)"><span class="unit">${unitFor(it.ex)}</span><button onclick="bump('${dISO}','${eid}',${i},'w',1,${prefWN})">+</button></div>
        <div class="stepper"><button onclick="bump('${dISO}','${eid}',${i},'r',-1,${prefRN})">−</button><input inputmode="numeric" value="${prefR}" placeholder="${tUnit}" oninput="setVal('${dISO}','${eid}',${i},'r',this.value)"><span class="unit">${tUnit==="secs"?"s":""}</span><button onclick="bump('${dISO}','${eid}',${i},'r',1,${prefRN})">+</button></div>
        <button class="done-btn ${s.done?"on":""}" onclick="toggleDone('${dISO}','${eid}',${i},${it.rest||0},${prefRN})">✓</button>
      </div>`;
    }
    h += `<button class="addset" onclick="addSet('${dISO}','${eid}')">+ add set</button></div>`;
  }
  h += `<textarea class="notes" rows="1" placeholder="Notes — felt easy? go up next time?" oninput="setNote('${dISO}','${eid}',this.value)">${log&&log.note?log.note:""}</textarea>`;
  h += `</div>`;
  return h;
}

// map eid back to exercise name
function eidOf(name){ return btoa(unescape(encodeURIComponent(name))).replace(/=/g,""); }
function exFromEid(eid, dISO){
  for(const T of allTemplates()){ for(const d of DAYS){ if(!T[d]) continue; for(const it of T[d].items){
    if(eidOf(it.ex)===eid) return it.ex; } } }
  if(dISO && DB[dISO] && DB[dISO].__extra){
    for(const x of DB[dISO].__extra){ if(eidOf(x.ex)===eid) return x.ex; }
  }
  // fallback: scan all extras
  for(const d of Object.keys(DB)){ if(DB[d].__extra){ for(const x of DB[d].__extra){ if(eidOf(x.ex)===eid) return x.ex; } } }
  return null;
}
function ensure(dISO, ex, i){
  if(!DB[dISO]) DB[dISO]={};
  if(!DB[dISO][ex]) DB[dISO][ex]={sets:[],note:""};
  while(i!==undefined && DB[dISO][ex].sets.length<=i){
    const prev = DB[dISO][ex].sets[DB[dISO][ex].sets.length-1];
    DB[dISO][ex].sets.push({w:prev?prev.w:"", r:"", done:false});
  }
  return DB[dISO][ex];
}
function setVal(dISO,eid,i,f,v){ const ex=exFromEid(eid,dISO); ensure(dISO,ex,i).sets[i][f]=v; saveDB(DB); }
function bump(dISO,eid,i,f,dir,pref){
  const ex=exFromEid(eid,dISO); const l=ensure(dISO,ex,i); const s=l.sets[i];
  if(f==="w"){
    let base=parseFloat(s.w);
    if(isNaN(base)) base=(pref!==null&&pref!==undefined&&!isNaN(parseFloat(pref))) ? parseFloat(pref) : 0;
    s.w=Math.max(0, base + dir*5);
  }
  else{
    let n=parseInt(s.r);
    if(isNaN(n)) n=(pref!==null&&pref!==undefined) ? parseInt(pref)+dir : Math.max(0,dir);
    else n=n+dir;
    s.r=Math.max(0,n);
  }
  saveDB(DB); render();
}
function toggleDone(dISO,eid,i,rest,prefR){
  const ex=exFromEid(eid,dISO); const l=ensure(dISO,ex,i); const s=l.sets[i];
  if((s.r===""||s.r===undefined) && !s.done && prefR!==null && prefR!==undefined) s.r = prefR;
  s.done=!s.done; saveDB(DB); render();
  if(s.done && rest) Timer.start(rest);
}
function addSet(dISO,eid){ const ex=exFromEid(eid,dISO); const l=ensure(dISO,ex); const prev=l.sets[l.sets.length-1];
  l.sets.push({w:prev?prev.w:"",r:"",done:false}); saveDB(DB); render(); }
function setNote(dISO,eid,v){ const ex=exFromEid(eid,dISO); ensure(dISO,ex).note=v; saveDB(DB); }
function ensureCardio(dISO,ex){
  if(!DB[dISO]) DB[dISO]={};
  if(!DB[dISO][ex]) DB[dISO][ex]={sets:[],note:""};
  if(!DB[dISO][ex].cardio) DB[dISO][ex].cardio={dur:"",split:"",done:false};
  return DB[dISO][ex];
}
function setCardio(dISO,eid,f,v){ const ex=exFromEid(eid,dISO); ensureCardio(dISO,ex).cardio[f]=v; saveDB(DB); }
function toggleCardioDone(dISO,eid){ const ex=exFromEid(eid,dISO); const c=ensureCardio(dISO,ex).cardio; c.done=!c.done; saveDB(DB); render(); }
// extras (added exercises)
function removeExtra(dISO,idx){
  if(DB[dISO]&&DB[dISO].__extra){ DB[dISO].__extra.splice(idx,1); saveDB(DB); render(); }
}
function addExtra(dISO){

function customExercises(){

const SYNC_KEY = KEY+"-sync";
let syncCfg = {url:"", last:"", lastDay:""};
try{ syncCfg = Object.assign(syncCfg, JSON.parse(localStorage.getItem(SYNC_KEY)||"{}")); }catch(e){}
function saveSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); }catch(e){} }
function setSyncUrl(v){ syncCfg.url = (v||"").trim(); saveSync(); }

function rowsForDay(dISO){
  const d = parseISO(dISO);
  const dayName = DAYS[(d.getDay()+6)%7];
  const wkN = Math.min(Math.max(weekOf(d),1),14);
  const t = dayPlan(wkN, dayName);
  const grpOf = {};
  t.items.forEach(it=>{ grpOf[it.ex] = it.grp||""; });
  const day = DB[dISO] || {};
  const rows = [];
  Object.keys(day).filter(k=>!k.startsWith("__")).forEach(ex=>{
    const e = day[ex];
    if(e.cardio && e.cardio.done){
      rows.push({date:dISO, day:dayName, week:wkN, session:t.label, exercise:ex,
        group:grpOf[ex]||"Cross-training", set:1, weight:"", reps:"",
        duration:e.cardio.dur||"", split:e.cardio.split||"", note:e.note||""});
      return;
    }
    (e.sets||[]).forEach((s,i)=>{
      if(!s.done) return;
      rows.push({date:dISO, day:dayName, week:wkN, session:t.label, exercise:ex,
        group:grpOf[ex]||"", set:i+1, weight:(s.w===""||s.w==null)?"":s.w,
        reps:(s.r===""||s.r==null)?"":s.r, duration:"", split:"",
        note:(i===0 ? (e.note||"") : "")});
    });
  });
  return rows;
}
function postRows(rows, lastDay){
  try{
    fetch(syncCfg.url, {method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({rows})});
    syncCfg.last = new Date().toISOString(); syncCfg.lastDay = lastDay || ""; saveSync();
    return true;
  }catch(err){ return false; }
}
function syncDay(dISO, quiet){
  if(!syncCfg.url) return false;
  const rows = rowsForDay(dISO);
  if(!rows.length){ if(!quiet) alertMsg("Nothing logged to sync"); return false; }
  const ok = postRows(rows, dISO);
  if(!quiet) alertMsg(ok ? "Sent to your sheet ✓" : "Sync failed — check the URL");
  return ok;
}
// One request for the whole history. Sending a request per day let them race
// each other server-side, which duplicated rows.
function syncAll(){
  if(!syncCfg.url){ alertMsg("Paste your sheet URL first"); return; }
  const days = Object.keys(DB).sort();
  let rows = [];
  days.forEach(d=>{ rows = rows.concat(rowsForDay(d)); });
  if(!rows.length){ alertMsg("Nothing logged yet"); return; }
  const ok = postRows(rows, days[days.length-1]);
  alertMsg(ok ? ("Sent "+days.length+" day"+(days.length===1?"":"s")+" ✓") : "Sync failed — check the URL");
}

function summaryText(){

// ---------- rest timer (wall-clock anchored: survives tab/app switches) ----------
const Timer = {
  endAt:0, iv:null,
  start(sec){ this.endAt = Date.now() + sec*1000;
    document.getElementById("timer").classList.add("show"); this.tick();
    clearInterval(this.iv); this.iv=setInterval(()=>this.tick(),500); },
  add(s){ this.endAt += s*1000; this.tick(); },
  left(){ return Math.round((this.endAt - Date.now())/1000); },
  tick(){ const l=this.left();
    if(l<=0){ this.stop(); if(navigator.vibrate) navigator.vibrate([200,100,200]); return; }
    const m=Math.floor(l/60), s=l%60;
    document.getElementById("timer-t").textContent = m+":"+String(s).padStart(2,"0"); },
  stop(){ clearInterval(this.iv); document.getElementById("timer").classList.remove("show"); }
};
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && Timer.endAt > 0 && Timer.left() > 0) Timer.tick(); });

// ---------- fuel ----------
function lrDayFor(wkN){
  return (PLAN.fuel.lrDays && PLAN.fuel.lrDays[String(wkN)]) || "Saturday";
}
function fuelFor(d){
  const dayName = DAYS[(d.getDay()+6)%7];
  const wkN = Math.min(Math.max(weekOf(d),1),14);
  const wd = PLAN.fuel.weekDays && PLAN.fuel.weekDays[String(weekOf(d))];
  const legacy = (weekOf(d)===1 && PLAN.fuel.week1Days) ? PLAN.fuel.week1Days[dayName] : null;
  const base = (wd && wd[dayName]) || legacy || PLAN.fuel.days[dayName];
  let cal = base.cal;
  if(dayName === lrDayFor(wkN)){
    const mi = PLAN.fuel.lrMiles[wkN-1] || 0;
    cal = PLAN.fuel.satBase + PLAN.fuel.satPerMile*mi;
    return {...base, cal, mi, wkN};
  }
  return {...base, cal, wkN};
}
// day "kind" drives the checklist: lift | hard | long | rest
function kindFor(dayName, f, wkN){
  if(f && f.kind) return f.kind;
  if(dayName === lrDayFor(wkN)) return "long";
  if(["Tuesday","Thursday"].includes(dayName)) return "hard";
  if(["Monday","Wednesday","Friday"].includes(dayName)) return "lift";
  return "rest";
}
function checklistFor(dayName, f, wkN){
  const c = PLAN.fuel.checklist;
  const kind = kindFor(dayName, f, wkN);
  let items = [...c.common];
  if(kind==="lift" || kind==="hard") items = items.concat(c.lift);
  if(kind==="hard") items = items.concat(c.hard);
  if(kind==="long") items = items.concat(c.long);
  if(kind==="rest") items = items.concat(c.rest);
  return items;
}

function renderWeek(){

// ---------- history ----------
function allExercises(){
  const s = new Set();
  allTemplates().forEach(T=>DAYS.forEach(d=>{ if(!T[d]) return; T[d].items.forEach(it=>{ if(it.grp && it.grp!=="Warm-up") s.add(it.ex); }); }));
  Object.values(DB).forEach(day=>Object.keys(day).forEach(e=>{ if(!e.startsWith("__")) s.add(e); }));
  return [...s].sort();
}
function renderHistory(){
  let h = `<h2>Exercise history</h2><select id="histsel" onchange="histEx=this.value;render()"><option value="">— pick an exercise —</option>`;
  allExercises().forEach(e=>h+=`<option ${e===histEx?"selected":""}>${e}</option>`);
  h += `</select>`;
  if(!histEx){ return h + `<div class="empty">Pick an exercise to see every session, your best sets, and whether you're trending up.<br><br>Log a few workouts first if this is day one. 💪</div>`; }
  const sessions = Object.keys(DB).filter(d=>{
    const e = DB[d][histEx]; if(!e) return false;
    return (e.sets && e.sets.some(s=>s.done)) || (e.cardio && e.cardio.done);
  }).sort().reverse();
  if(!sessions.length) return h + `<div class="empty">No logged sessions for ${histEx} yet.</div>`;
  h += `<div class="card">`;
  const bests = sessions.map(d=>{
    const sets = (DB[d][histEx].sets||[]).filter(s=>s.done);
    return sets.length ? Math.max(...sets.map(s=>parseFloat(s.w)||0)) : null;
  });
  sessions.forEach((d,i)=>{
    const e = DB[d][histEx];
    const sets = (e.sets||[]).filter(s=>s.done);
    if(!sets.length && e.cardio && e.cardio.done){
      h += `<div class="hist-sess"><div class="hist-date"><span>${d}</span><span>cardio</span></div>
        <div class="hist-sets">${[e.cardio.dur,e.cardio.split].filter(Boolean).join(" · ")||"done ✓"}</div>
        ${e.note?`<div class="hist-note">"${e.note}"</div>`:""}</div>`;
      return;
    }
    const best = bests[i], prev = bests[i+1];
    const trend = (prev===undefined||prev===null||best===null) ? "" : (best>prev ? ` <span class="trend-up">▲</span>` : (best===prev?` <span class="trend-flat">—</span>`:` <span style="color:var(--red)">▼</span>`));
    h += `<div class="hist-sess"><div class="hist-date"><span>${d}</span><span>best ${best||"BW"}${trend}</span></div>
      <div class="hist-sets">${fmtSets(sets)}</div>
      ${e.note?`<div class="hist-note">"${e.note}"</div>`:""}</div>`;
  });
  return h+"</div>";
}

// ---------- plan editor ----------
let edDay="Monday", edLabel="", edItems=[], edGrp="";
function baseDay(d){ return planEdits[d] || PLAN.template[d]; }
function openEditor(d){
  edDay = d || edDay;
  const b = baseDay(edDay);
  edLabel = b.label;
  edItems = JSON.parse(JSON.stringify(b.items));
  tab="editor"; render(); window.scrollTo(0,0);
}
function edSelectDay(d){ openEditor(d); }
function edMove(i,dir){
  const j=i+dir; if(j<0||j>=edItems.length) return;
  const t=edItems[i]; edItems[i]=edItems[j]; edItems[j]=t; render();
}
function edRemove(i){ edItems.splice(i,1); render(); }
function edField(i,f,v){ edItems[i][f]=(f==="sets"||f==="rest")?(parseInt(v)||null):v; }
function edLabelSet(v){ edLabel=v; }
function edAdd(){
  const grp=document.getElementById("ed-grp").value;
  const sel=document.getElementById("ed-ex").value;
  const custom=document.getElementById("ed-custom");
  const name=(sel==="__custom__" ? (custom?custom.value.trim():"") : sel);
  if(!grp||!name) return;
  edItems.push({ex:name, grp:grp, wt:null, sets:3, reps:"8-12", rest:60, notes:null, desc:null});
  render();
}
function edSave(){
  planEdits[edDay]={label:edLabel, items:edItems};
  savePlanEdits(); go("plan"); alertMsg("Saved — "+edDay+" updated ✓");
}
function edReset(){
  delete planEdits[edDay]; savePlanEdits(); openEditor(edDay); alertMsg(edDay+" reset to default");
}
function renderEditor(){
  const grps=Object.keys(PLAN.groups);
  const g=edGrp||grps[0];
  const customs=customExercises();
  let h=`<h2>✏️ Edit plan — pick a day</h2><div class="daynav">`;
  DAYS.forEach(d=>{ h+=`<button class="daybtn ${d===edDay?"on":""}" onclick="edSelectDay('${d}')">${d.slice(0,3)}<span class="dd">${planEdits[d]?"✎":""}</span></button>`; });
  h+=`</div>
  <input class="cardio-in" style="width:100%;margin:6px 0 10px" value="${edLabel}" placeholder="Session name" onchange="edLabelSet(this.value)">`;
  edItems.forEach((it,i)=>{
    h+=`<div class="card" style="padding:10px 12px">
      <div class="ex-head"><div style="flex:1">
        <span class="ex-name" style="font-size:14px">${it.ex}</span>${it.grp?`<span class="chip">${it.grp}</span>`:""}
        <div style="display:flex;gap:6px;margin-top:7px">
          <input class="cardio-in" style="flex:0 0 62px" inputmode="numeric" value="${it.sets??""}" placeholder="sets" onchange="edField(${i},'sets',this.value)">
          <input class="cardio-in" style="flex:0 0 84px" value="${it.reps??""}" placeholder="reps" onchange="edField(${i},'reps',this.value)">
          <input class="cardio-in" style="flex:0 0 72px" inputmode="numeric" value="${it.rest??""}" placeholder="rest s" onchange="edField(${i},'rest',this.value)">
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <button class="done-btn" style="margin:0;height:30px;width:34px" onclick="edMove(${i},-1)">↑</button>
        <button class="done-btn" style="margin:0;height:30px;width:34px" onclick="edMove(${i},1)">↓</button>
        <button class="done-btn" style="margin:0;height:30px;width:34px" onclick="edRemove(${i})">✕</button>
      </div></div></div>`;
  });
  h+=`<div class="card"><div style="font-weight:700;font-size:13px;margin-bottom:8px">Add exercise</div>
    <select id="ed-grp" onchange="edGrp=this.value;render()">${grps.map(x=>`<option ${x===g?"selected":""}>${x}</option>`).join("")}</select>
    <select id="ed-ex">${PLAN.groups[g].map(x=>`<option>${x}</option>`).join("")}${customs.map(x=>`<option>${x}</option>`).join("")}<option value="__custom__">✏️ Type my own…</option></select>
    <input id="ed-custom" class="cardio-in" style="width:100%;margin-bottom:10px" placeholder="Custom exercise name (if 'Type my own')">
    <button class="btn" style="margin:0" onclick="edAdd()">+ Add to ${edDay}</button></div>
  <button class="btn primary" onclick="edSave()">💾 Save ${edDay}</button>
  ${planEdits[edDay]?`<button class="btn" onclick="edReset()">↩︎ Reset ${edDay} to default plan</button>`:""}
  <button class="btn" onclick="go('plan')">← Back (discard unsaved)</button>
  <div class="card" style="font-size:12px;color:var(--dim);line-height:1.5">Edits apply to EVERY week going forward and override the built-in plan for that day. Logging and history work the same. Reset returns the day to the coach's plan.</div>`;
  return h;
}

// ---------- help ----------
function renderHelpHTML(){
  const items = [
    ["Logging a workout","Open Today, tap ✓ after each set — weight and reps are pre-filled from your last session (or the target). Adjust with +/− or type directly. Notes box per exercise: write to your future self ('go up next time')."],
    ["Rest timer","Starts automatically when you check a set that has a rest target. It keeps correct time even if you switch apps."],
    ["Finishing","Tap 🏁 Finish workout — the day gets a ✓ and you get a summary card to screenshot or 📤 Share. Reopen any day's summary from the 📸 buttons on the Week tab."],
    ["Changing the plan","Plan tab → ✏️ Edit plan. Pick a day, then add, remove, reorder exercises or change sets/reps/rest. Save applies it to every week going forward; Reset brings back the default. One-off additions: use + Add exercise on the Today screen instead."],
    ["Fuel tab","Daily calorie + protein targets matched to the training day, a tap-off checklist, and a heads-up the night before big days."],
    ["Your data","Everything saves on THIS device automatically. Data tab → Export for a backup (do it weekly). Import merges a backup back in. Only log in one place — the home-screen app."],
    ["Updating the app","Data tab → 🔄 Reload app pulls the newest version. Your logs are never touched by updates."],
  ];
  return `<h2 style="margin-top:18px">❓ How to use this app</h2>` + items.map(([t,b])=>
    `<div class="card" style="padding:11px 14px"><div style="font-weight:700;font-size:13px;margin-bottom:3px">${t}</div><div style="font-size:12.5px;color:var(--dim);line-height:1.5">${b}</div></div>`).join("");
}

// ---------- plan ----------
function renderPlan(){
  const wkN = Math.min(Math.max(weekOf(new Date()),1),14);
  let h = `<h2>14 weeks to race day — Nov 1, 2026</h2><div class="card" style="padding:6px 10px"><table>
    <tr><th>Wk</th><th>Phase</th><th>Strength focus</th></tr>`;
  PLAN.weeks.forEach(w=>{
    const mon = mondayOfWeek(w.wk);
    const phCls = "ph-"+w.phase.split(" ")[0].replace("RACE","RACE");
    h += `<tr class="${w.wk===wkN?"cur":""}"><td><b>${w.wk}</b><br><span style="color:var(--dim);font-size:10px">${mon.getMonth()+1}/${mon.getDate()}</span></td>
      <td class="${phCls}">${w.phase}</td><td>${w.strength}</td></tr>`;
  });
  h += `</table></div>
  <button class="btn primary" onclick="openEditor()">✏️ Edit plan</button>`;
  h += renderHelpHTML();
  return h;
}

// ---------- data ----------
function renderData(){
  const n = Object.keys(DB).length;
  let h = `<h2>Your data</h2>`;
  if(!canStore) h += `<div class="warn"><b>Heads up:</b> this browser doesn't allow saved storage, so logs live only while this page is open. Export below before closing, and paste back in next time (or open this file from your phone's Files app / a real browser tab where saving works).</div>`;
  else h += `<div class="card" style="font-size:13px;color:var(--dim)">Logs are saved on this device automatically (${n} day${n===1?"":"s"} logged). Export a backup every week or two — phones clear browser storage sometimes.</div>`;
  h += `<button class="btn" onclick="location.reload()">🔄 Reload app (get latest version)</button>
    <button class="btn primary" onclick="doExport()">📤 Export backup (download JSON)</button>
    <button class="btn" onclick="doCopy()">📋 Copy backup to clipboard</button>
    <div style="margin:14px 4px 6px;font-size:12px;color:var(--dim)">Restore: paste a backup below</div>
    <textarea class="io" id="io" placeholder='{"2026-07-27": ...}'></textarea>
    <button class="btn" onclick="doImport()">📥 Import (merges with existing)</button>`;
  // ---- sheet sync ----
  const on = !!syncCfg.url;
  const when = syncCfg.last ? new Date(syncCfg.last).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) : null;
  h += `<div class="session-label">Google Sheet sync</div>
    <div class="card">
      <div style="font-size:12.5px;color:var(--dim);line-height:1.5;margin-bottom:9px">
        Every workout you finish gets sent to your Google Sheet automatically, so your coach can read the
        actual numbers instead of you sending screenshots. Paste the Web App URL from Apps Script below —
        it stays on this device.
      </div>
      <input class="io" style="height:auto;min-height:0;padding:9px" id="syncurl" placeholder="https://script.google.com/macros/s/..../exec"
        value="${(syncCfg.url||"").replace(/"/g,"&quot;")}" oninput="setSyncUrl(this.value)">
      <div style="font-size:12px;margin-top:8px;color:${on?"var(--green,#4caf50)":"var(--dim)"}">
        ${on ? (when ? `Connected · last sent ${when}${syncCfg.lastDay?` (${syncCfg.lastDay})`:""}` : "Connected · nothing sent yet") : "Not connected yet"}
      </div>
    </div>
    <button class="btn" onclick="syncDay(iso(viewDate))">📊 Send today's workout to the sheet</button>
    <button class="btn" onclick="syncAll()">📚 Send everything I've ever logged</button>`;
  return h;
}
function exportObj(){ return {v:2, logs:DB, plan:planEdits}; }
function doExport(){
  const blob = new Blob([JSON.stringify(exportObj(),null,1)],{type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "nyc26-log-backup.json"; a.click();
}
function doCopy(){
  const t = JSON.stringify(exportObj());
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>alertMsg("Copied ✓"));
  else { const el=document.getElementById("io"); el.value=t; el.select(); document.execCommand("copy"); alertMsg("Copied ✓"); }
}
function doImport(){
  try{
    const obj = JSON.parse(document.getElementById("io").value);
    const logs = (obj && obj.v===2 && obj.logs) ? obj.logs : obj;
    Object.keys(logs).forEach(d=>{ DB[d] = Object.assign(DB[d]||{}, logs[d]); });
    if(obj && obj.v===2 && obj.plan){ Object.assign(planEdits, obj.plan); savePlanEdits(); }
    saveDB(DB); alertMsg("Imported ✓"); render();
  }catch(e){ alertMsg("Couldn't parse that — is it the full JSON?"); }
}
function alertMsg(m){ const pb=document.getElementById("phaseband"); pb.style.display="block"; pb.innerHTML="<b>"+m+"</b>"; setTimeout(render,1200); }

render();
</script>
