// ---------- week view ----------
function renderWeek(){
  const wkN = Math.min(Math.max(weekOf(viewDate),1),25);
  const mon = mondayOfWeek(wkN);
  // week stats
  let totalSets = 0, daysDone = 0, progressed = new Set();
  for(let i=0;i<7;i++){
    const d = new Date(mon); d.setDate(d.getDate()+i);
    const dISO = iso(d), day = DB[dISO] || {};
    let daySets = 0;
    Object.keys(day).filter(k=>!k.startsWith("__")).forEach(ex=>{
      const e = day[ex];
      const sets = (e.sets||[]).filter(s=>s.done);
      daySets += sets.length;
      if(e.cardio && e.cardio.done) daySets += 1;
      if(sets.length){
        const best = Math.max(...sets.map(s=>parseFloat(s.w)||0));
        const prev = lastPerf(ex, dISO);
        if(prev){ const pb = Math.max(...prev.sets.map(s=>parseFloat(s.w)||0)); if(best>pb) progressed.add(ex); }
      }
    });
    totalSets += daySets;
    if(daySets>0 || (day.__day&&day.__day.finished)) daysDone++;
  }
  let h = `<div class="sum-card" style="margin-bottom:12px">
    <div class="sum-head"><div class="sum-title">WEEK ${wkN}</div>
    <div class="sum-date">${weekInfo(wkN)?weekInfo(wkN).phase:""} · ${mon.getMonth()+1}/${mon.getDate()}–${(m=>m.getMonth()+1+"/"+m.getDate())(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6))}</div></div>
    <div class="sum-foot" style="border-top:none;padding-top:2px">
      <span>${daysDone}/7 days active</span><span>${totalSets} sets</span><span>${progressed.size? "▲ "+progressed.size+" lifts up":"—"}</span>
    </div>
    ${progressed.size?`<div style="font-size:11.5px;color:var(--green);padding:0 14px 12px">${[...progressed].slice(0,6).join(" · ")}</div>`:""}
  </div><h2>Sessions</h2>`;
  for(let i=0;i<7;i++){
    const d = new Date(mon); d.setDate(d.getDate()+i);
    const dISO = iso(d), dayName = DAYS[i], t = dayPlan(wkN, dayName);
    const day = DB[dISO] || {};
    const logged = Object.keys(day).filter(k=>!k.startsWith("__")).reduce((a,ex)=>a+((day[ex].sets||[]).filter(s=>s.done).length)+((day[ex].cardio&&day[ex].cardio.done)?1:0),0);
    const fin = day.__day && day.__day.finished;
    h += `<div class="card" onclick="setDate('${dISO}');go('today')" style="cursor:pointer">
      <div class="ex-head"><div><span class="ex-name">${fin?"✅ ":""}${dayName} <span style="color:var(--dim);font-weight:400;font-size:12px">${d.getMonth()+1}/${d.getDate()}</span></span>
      <div class="target">${t.label}</div></div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:12px;color:${logged?"var(--green)":"var(--dim)"};white-space:nowrap">${logged?logged+" sets ✓":"—"}</span>
        ${logged||fin?`<button class="done-btn" style="margin:0" onclick="event.stopPropagation();viewSummary('${dISO}')">📸</button>`:""}
      </div></div></div>`;
  }
  return h;
}

// ---------- history ----------
function allExercises(){
  const s = new Set();
  allTemplates().forEach(T=>DAYS.forEach(d=>{ if(!T[d]) return; T[d].items.forEach(it=>{ if(it.grp && it.grp!=="Warm-up") s.add(it.ex); }); }));
  Object.values(DB).forEach(day=>Object.keys(day).forEach(e=>{ if(!e.startsWith("__")) s.add(e); }));
  return [...s].sort();
}
function renderHistory(){
  let h = `<h2>Exercise history</h2><select id="histsel" onchange="histEx=this.value;render()"><option value="">— pick an exercise —</option>`;
  allExercises().forEach(e=>h+=`<option ${e===histEx?"selected":""}>${e}</option>`);
  h += `</select>`;
  if(!histEx){ return h + `<div class="empty">Pick an exercise to see every session, your best sets, and whether you're trending up.<br><br>Log a few workouts first if this is day one. 💪</div>`; }
  const sessions = Object.keys(DB).filter(d=>{
    const e = DB[d][histEx]; if(!e) return false;
    return (e.sets && e.sets.some(s=>s.done)) || (e.cardio && e.cardio.done);
  }).sort().reverse();
  if(!sessions.length) return h + `<div class="empty">No logged sessions for ${histEx} yet.</div>`;
  h += `<div class="card">`;
  const bests = sessions.map(d=>{
    const sets = (DB[d][histEx].sets||[]).filter(s=>s.done);
    return sets.length ? Math.max(...sets.map(s=>parseFloat(s.w)||0)) : null;
  });
  sessions.forEach((d,i)=>{
    const e = DB[d][histEx];
    const sets = (e.sets||[]).filter(s=>s.done);
    if(!sets.length && e.cardio && e.cardio.done){
      h += `<div class="hist-sess"><div class="hist-date"><span>${d}</span><span>cardio</span></div>
        <div class="hist-sets">${[e.cardio.dur,e.cardio.split].filter(Boolean).join(" · ")||"done ✓"}</div>
        ${e.note?`<div class="hist-note">"${e.note}"</div>`:""}</div>`;
      return;
    }
    const best = bests[i], prev = bests[i+1];
    const trend = (prev===undefined||prev===null||best===null) ? "" : (best>prev ? ` <span class="trend-up">▲</span>` : (best===prev?` <span class="trend-flat">—</span>`:` <span style="color:var(--red)">▼</span>`));
    h += `<div class="hist-sess"><div class="hist-date"><span>${d}</span><span>best ${best||"BW"}${trend}</span></div>
      <div class="hist-sets">${fmtSets(sets)}</div>
      ${e.note?`<div class="hist-note">"${e.note}"</div>`:""}</div>`;
  });
  return h+"</div>";
}

function exportObj(){ return {v:2, logs:DB, plan:planEdits}; }
async function doExport(){
  const txt = JSON.stringify(exportObj(),null,1);
  const name = "tokyo27-log-backup.json";
  // iOS standalone apps silently swallow <a download>. The share sheet works; fall back to download.
  try{
    if(navigator.canShare){
      const f = new File([txt], name, {type:"application/json"});
      if(navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:name}); return; }
    }
  }catch(e){ /* cancelled or unsupported - fall through */ }
  const blob = new Blob([txt],{type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = name; a.click();
}
// Recovery hatch: pulls restore.json from this app's own folder and MERGES it in.
// Object.assign per day, same semantics as doImport - never clobbers newer entries.
// A plain location.reload() is served from cache in an iOS home-screen app, so the
// "get latest version" button did nothing. Bounce through a fresh query string instead.
function hardReload(){
  const u = location.pathname + "?v=" + Date.now();
  location.replace(u);
}
async function restoreFromRepo(){
  try{
    const res = await fetch("restore.json?t="+Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const obj = await res.json();
    const logs = (obj && obj.v===2 && obj.logs) ? obj.logs : obj;
    let n = 0;
    Object.keys(logs).forEach(d=>{ DB[d] = Object.assign(DB[d]||{}, logs[d]); n++; });
    // Purge malformed entries: a real entry is keyed by its exercise NAME and has no "ex"
    // field. An entry carrying ex !== key is junk from an earlier, wrongly-shaped restore.
    Object.keys(DB).forEach(d=>{
      const day = DB[d]; if(!day || typeof day!=="object") return;
      Object.keys(day).forEach(k=>{
        if(k.startsWith("__")) return;
        const e = day[k];
        if(e && typeof e==="object" && e.ex && e.ex !== k) delete day[k];
      });
    });
    if(obj && obj.v===2 && obj.plan){ Object.assign(planEdits, obj.plan); savePlanEdits(); }
    saveDB(DB); window.__restoreMsg = "Restored " + n + " days \u2713 (" + Object.keys(DB).length + " total on this device)";
    alertMsg(window.__restoreMsg); render();
  }catch(e){ window.__restoreMsg = "Restore FAILED \u2014 " + (e.message || e); alertMsg(window.__restoreMsg); render(); }
}
function doCopy(){
  const t = JSON.stringify(exportObj());
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>alertMsg("Copied ✓"));
  else { const el=document.getElementById("io"); el.value=t; el.select(); document.execCommand("copy"); alertMsg("Copied ✓"); }
}
function doImport(){
  try{
    const obj = JSON.parse(document.getElementById("io").value);
    const logs = (obj && obj.v===2 && obj.logs) ? obj.logs : obj;
    Object.keys(logs).forEach(d=>{ DB[d] = Object.assign(DB[d]||{}, logs[d]); });
    if(obj && obj.v===2 && obj.plan){ Object.assign(planEdits, obj.plan); savePlanEdits(); }
    saveDB(DB); alertMsg("Imported ✓"); render();
  }catch(e){ alertMsg("Couldn't parse that — is it the full JSON?"); }
}
function alertMsg(m){
  // NOTE: this used to write into #phaseband, which render() force-hides on the data,
  // history, summary and editor tabs - so confirmations were invisible exactly where
  // the buttons live. Independent toast element; render() never touches it.
  let t = document.getElementById("toast");
  if(!t){
    t = document.createElement("div"); t.id = "toast";
    t.style.cssText = "position:fixed;left:12px;right:12px;bottom:92px;z-index:50;"
      + "background:#1d6f42;color:#fff;padding:13px 15px;border-radius:12px;"
      + "font-size:13.5px;font-weight:700;text-align:center;line-height:1.4;"
      + "box-shadow:0 10px 28px rgba(0,0,0,.55);"
      + "transform:translateY(calc(-1 * var(--kb,0px)))";
    document.body.appendChild(t);
  }
  t.textContent = m;
  t.style.background = /fail|couldn|error/i.test(m) ? "#8c2b2b" : "#1d6f42";
  t.style.display = "block";
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>{ t.style.display = "none"; }, 3500);
  setTimeout(render, 1200);
}

render();

// ---- iOS: keep the fixed bars pinned to the VISUAL viewport ----
// When the soft keyboard opens, iOS shrinks the visual viewport. Fixed elements
// anchored to bottom:0 end up stranded mid-page and often don't reflow when the
// keyboard closes (worse when the element has a backdrop-filter, which promotes
// it to its own compositing layer - that filter has been removed).
(function(){
  var vv = window.visualViewport;
  if(!vv) return;
  function fix(){
    var hidden = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty("--kb", hidden + "px");
    document.body.classList.toggle("kb-open", hidden > 120);
  }
  vv.addEventListener("resize", fix);
  vv.addEventListener("scroll", fix);
  window.addEventListener("orientationchange", function(){ setTimeout(fix, 300); });
  window.addEventListener("focusout", function(){ setTimeout(fix, 120); });
  fix();
})();
</script>
</body>
</html>
